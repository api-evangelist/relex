note: 'Derived mechanically from the RELEX Data API contract: every /data/* resource whose request body
  wraps a data[] array of a component schema, plus the id-reference fields those schemas carry. RELEX
  publishes no public object reference or ERD, and the object model is partly per-customer (the "Custom"
  tag and the data-model half of the version number), so this graph describes the EXAMPLE CUSTOMER contract
  RELEX publishes, not a universal RELEX schema.'
identity_model:
  surrogate_ids: false
  note: 'There is no global id field and no id-prefix scheme. Records are keyed by BUSINESS keys - almost
    every transactional and product-level entity is identified by the composite of `product` and `location`
    (plus a date or timestamp where the record is time-series). That is what makes POST an upsert: re-POSTing
    the same product+location+date overwrites in place. Only the four GET-able output resources (sales_forecasts,
    order_proposals, workload driver forecasts) expose an {id} path parameter, and that id is the handle
    the webhook payload carries.'
