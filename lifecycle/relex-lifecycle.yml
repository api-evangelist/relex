- api: RELEX Monitoring API (service root)
  url: https://us.monitor.relexsolutions.com/
  auth_required: false
  probed: '2026-08-26'
  http_status: 200
  observed_body_shape: '{"agents":{},"now":"<timestamp>","status":"ok"}'
