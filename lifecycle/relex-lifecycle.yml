changelog:
  published: false
  note: >-
    No public, dated changelog or release-notes page exists for either API. Version history sits
    inside the RELEX Developer Portal at docs.relexsolutions.com, which requires an Auth0 login.
    Because RELEX version numbers are partly per-customer, a shared public changelog would be only
    partially meaningful — but the Core half of the version is shared and is not published.
