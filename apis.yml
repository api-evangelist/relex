apis:
- aid: relex:relex-data-api
  name: RELEX Data API
  description: 'The RELEX Data API is the near-real-time REST interface for exchanging master
    data, transactional data and customer-specific custom resources between a customer''s ERP,
    POS, WMS or MDM systems and the RELEX planning platform. It is a batch-oriented REST design:
    a single POST can upsert many records at once (up to a 1 MB payload), POST and DELETE are
    documented as idempotent, errors follow RFC 7807 problem+json, and asynchronous ingestion
    errors are retrievable through a paged /meta/errors resource. Webhooks (delivered via Svix,
    HMAC-SHA256 signed) notify clients when planning output data becomes available.'
  humanURL: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
  baseURL: https://eu.rest.relexsolutions.com
  tags:
  - Data Integration
  - Supply Chain
  - Retail
  - Transactions
  - Master Data
  properties:
  - type: OpenAPI
    url: openapi/relex-data-api-openapi.json
  - type: Documentation
    url: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
  - type: Webhooks
    url: asyncapi/relex-data-api-webhooks.yml
  - type: Overlay
    url: overlays/relex-data-api-overlay.yaml
- aid: relex:relex-monitoring-api
  name: RELEX Monitoring API
  description: 'The RELEX Monitoring API lets customers observe the status of their own RELEX
    environments programmatically: file ingestion events, planning job events, environment
    inventory and platform metrics. It is an OpenAPI 3.1 REST contract secured with OAuth 2.0
    client credentials against RELEX Identity, served from regional hosts in the EU and US,
    with a public Python demo client published on GitHub.'
  humanURL: https://www.relexsolutions.com/relex-monitoring-api/
  baseURL: https://eu.monitor.relexsolutions.com
  tags:
  - Monitoring
  - Observability
  - Supply Chain
  properties:
  - type: OpenAPI
    url: openapi/relex-monitoring-api-openapi.json
  - type: Documentation
    url: https://www.relexsolutions.com/api/monitoring-api-example-customer.html
  - type: SourceCode
    url: https://github.com/relex/monitoring-api-demo
  - type: Overlay
    url: overlays/relex-monitoring-api-overlay.yaml
