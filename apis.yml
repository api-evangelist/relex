aid: relex
name: RELEX Solutions
description: 'RELEX Solutions is a Helsinki-headquartered supply chain and retail planning
  software company whose unified platform covers demand forecasting, inventory and replenishment,
  space and assortment, pricing and promotions, workforce and store operations, and integrated
  business planning for retailers, wholesalers and consumer goods manufacturers. Its developer
  surface is deliberately narrow and integration-centric: customer data reaches the platform
  through the RELEX Data API (an OpenAPI 3.1 REST contract with 91 operations across master
  data, transactions, metadata and customer-specific custom resources), a Batch API over Azure
  Blob Storage or SFTP, a bi-directional SAP Connector, and Snowflake data sharing, while
  operational visibility is exposed through the RELEX Monitoring API for file and job events.
  Both APIs are secured with OAuth 2.0 client credentials against RELEX Identity, publish
  RFC 7807 problem responses, and are documented publicly as ReDoc reference pages, while the
  full RELEX Developer Portal at docs.relexsolutions.com sits behind an Auth0 login.'
