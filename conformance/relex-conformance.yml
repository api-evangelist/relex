  market: retail and supply chain planning (demand forecasting, replenishment, assortment, pricing)
  candidates_checked:
  - standard: GS1 / GTIN / EAN product identification
    result: not declared — no gtin, ean or gs1 field, schema or identifier scheme appears anywhere
      in the 174-schema Data API contract. Products carry RELEX/customer-native identifiers, and a
      `retail_barcode` resource exists but declares no GS1 semantics.
  - standard: EDIFACT / ANSI X12 order and despatch messages
    result: not declared — no EDI message type appears in the contract. Order proposals, purchase
      orders and deliveries are modelled as native JSON resources.
  - standard: SCIM 2.0
    result: scope name only, no published surface — see the scim entry above.
  - standard: ISO 20022
    result: not applicable — RELEX is not a payments or financial-messaging provider.
  note: >-
    REWARD-ONLY CHECK, HONESTLY MISSED. RELEX's market does have candidate standards (GS1 above
