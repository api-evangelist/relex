components:
  schemas:
    order:
      type: object
      properties:
        product:
          type: string
          description: Product code. Reference to Products.
          example: PRODUCT1
          minLength: 1
        location:
          type: string
          description: Location code. Reference to Locations.
          example: LOCATION1
          minLength: 1
        date:
          type: string
          minLength: 1
          format: date
          description: The order date of the order row. Because it is used as a key its value must not be changed when modifying an order.
          example: '2022-11-08'
        quantity:
          type: number
          description: Quantity currently open to be delivered. Used in order proposal calculation.
          example: 100
        requested_quantity:
          type:
          - number
          - 'null'
          description: Quantity originally requested to be delivered in order row. Typically effective quantity from order proposal row.
          example: 100
        confirmed_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Delivery date confirmed by supplier.
          example: '2022-12-12'
        delivered_quantity:
          type:
          - number
          - 'null'
          description: Quantity that has been delivered for this order row.
          example: 80
        reference:
          type:
          - string
          - 'null'
          minLength: 1
          description: Order (header) reference number
          example: PO4233
        order_row:
          type:
          - string
          - 'null'
          description: Order row number.
          example: '1'
        estimated_date:
          type: string
          minLength: 1
          format: date
          description: Currently expected delivery date.
          example: '2022-12-17'
        requested_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Originally requested delivery date. Typically delivery date from order proposal row according to delivery schedule used in the calculation.
          example: '2022-12-10'
        estimated_delivery_time:
          description: Currently expected delivery time (24h clock hh:mm).
          $ref: '#/components/schemas/time'
        time:
          description: Order time of the order row (24h clock hh:mm).
          $ref: '#/components/schemas/time'
        confirmed_quantity:
          type:
          - number
          - 'null'
          description: Quantity currently open to be delivered. Used in order proposal calculation.
          example: 100
        partner_code:
          type:
          - string
          - 'null'
          minLength: 1
          description: Supplier of the order row
          example: SU4320
        order_type:
          type:
          - string
          - 'null'
          minLength: 1
          description: Free-form text field for defining the order type.
          example: DC_ORDER
        value:
          type:
          - number
          - 'null'
          description: Monetary value (in currency) of the order row.
          example: 200
        delivered_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Actual realized date when order row was delivered.
          example: '2022-12-14'
        status:
          type:
          - string
          - 'null'
          minLength: 1
          description: Status of the order row.
          example: OPEN
          enum:
          - CLOSED
          - CONFIRMED
          - OPEN
          - PARTIALLY_DELIVERED
          - null
        expiration_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Expiration date of the goods to be received.
          example: '2023-06-06'
      required:
      - product
      - location
      - date
      - quantity
      - estimated_date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_order_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/order'
    batch_balance:
      type: object
      properties:
        type:
          type: string
          minLength: 1
          description: 'Supported balance type: BATCH_BALANCE = Current physical stock divided to batches based on spoiling date'
          example: BATCH_BALANCE
          enum:
          - BATCH_BALANCE
        product:
          type: string
          minLength: 1
          description: Item code (code for finished product or stock keeping unit)
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Inventory location code (i.e. code for affected store, warehouse, etc.). Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: Balance date i.e. date of the batch balance. Previous day's date in the daily transfer. For historical balances the date of the balance.
          example: '2018-09-30'
        balance:
          type: number
          description: "Physical batch balance quantity in the location in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit). \nBatch balance quantity should be always positive and the sum of non-expired batch balances should equal the normal balance."
          example: 3
        value:
          type:
          - number
          - 'null'
          description: Value of the whole transaction in the location's currency (e.g. €, £, $). Value should always be positive as transaction quantity determines the direction of the transaction. Usually based on purchase price. Negative values are automatically converted to the positive absolute value of the inserted value.
          minimum: 0
          example: 5.97
        time:
          description: If batch balances are sent multiple times during the day, indicates the time when balance was fetched from source system
          $ref: '#/components/schemas/time'
        estimated_date:
          type: string
          minLength: 1
          format: date
          description: Last valid date ('Best before date') for the batch. Batch balance is expected to become non-sellable at the end of this date. Forecasted spoilage in RELEX takes also product-location's required remaining shelf life into account (effective spoiling date = 'estimated_date' - 'required remaining shelf life').
          example: '2018-10-05'
        batch_manufacturing_date:
          type:
          - string
          - 'null'
          format: date
          description: Date of manufacture of the batch. Only relevant for manufacturing customers.
          example: '2018-10-05'
        batch_code:
          type:
          - string
          - 'null'
          description: Unique identifier for the manufactured batch. Only relevant for manufacturing customers.
          example: MB103938485
        production_date:
          type:
          - string
          - 'null'
          format: date
          description: Production date. The date when the batch was produced.
          example: '2025-03-01'
        available_date:
          type:
          - string
          - 'null'
          format: date
          description: Available date. When the batch is in quality control or ageing, the date when it is expected to be available for sale and consumption.
          example: '2025-09-09'
      required:
      - type
      - product
      - location
      - date
      - balance
      - estimated_date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_workload_driver_forecasts_quarter:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: /schema/generic_export/workload_driver_forecasts_quarter/1.json
      type: object
      additionalProperties: false
      required:
      - meta
      - data
      properties:
        meta:
          type: object
          additionalProperties: false
          required:
          - exported_at
          - configured_at
          - primary_resource
          - schema
          default: {}
          title: Response metadata
          properties:
            exported_at:
              type: string
              format: date-time
              title: Exported At
              description: The time the content was exported
            configured_at:
              type: string
              format: date-time
              title: Configured At
              description: The time the response was configured at the host system. This can be used to detect updates for the schema.
            primary_resource:
              type: string
              title: Primary Resource
              description: The primary resource for the data
            schema:
              type: string
              title: Schema Path
              description: The schema path for the data
        data:
          type: array
          additionalProperties: false
          required: []
          title: Data Records
          items:
            type: object
            additionalProperties: false
            properties:
              workload_driver_type_code:
                type: string
                title: Workload driver type code
                description: Identifier of the type of the workload driver
              location_code:
                type: string
                title: Location code
                description: Identifier for location
              effective_quantity:
                type: number
                title: Effective forecast quantity
                description: Effective forecast quantity
              date:
                type: string
                format: date
                title: Date
                description: Defines the date of the effective forecast
              time:
                type: string
                format: time
                title: Time
                example: '14:15'
                description: Defines the quarter of an hour of the effective forecast (hh:mm)
    retail_lost_sale_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/lost_sale'
    daily_sale:
      type: object
      properties:
        date:
          type: string
          minLength: 1
          format: date
          description: Transaction posting date
          example: '2020-12-15'
        location:
          type: string
          description: Location code. Reference to Locations.
          example: LOCATION1
          minLength: 1
        product:
          type: string
          description: Product code. Reference to Products.
          example: PRODUCT1
          minLength: 1
        quantity:
          type: number
          description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
          example: -1
        type:
          type: string
          minLength: 1
          description: 'Type of the transaction: SALE'
          example: SALE
          enum:
          - SALE
        transaction_uid:
          type:
          - string
          - 'null'
          description: 'Unique identifier for transaction row. '
          example: TID12345
        value:
          type:
          - number
          - 'null'
          description: Value as of revenue of the whole transaction in the location's currency (e.g. €, £, $) excluding sales taxes (e.g. VAT). Value should always be positive as transaction quantity determines the direction of the transaction.
          example: 15
      required:
      - date
      - location
      - product
      - quantity
      - type
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    transfer:
      type: object
      properties:
        type:
          type: string
          minLength: 1
          description: Type of the transaction. Always TRANSFER.
          example: TRANSFER
          enum:
          - TRANSFER
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: Transaction posting date.
          example: '2018-07-01'
        quantity:
          type: number
          description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
          example: -2
        transaction_uid:
          type:
          - string
          - 'null'
          description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
          example: TID12345
        value:
          type:
          - number
          - 'null'
          description: Value of the whole transaction in the location's currency (e.g.€, £, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
          minimum: 0
          example: 3.98
        partner_code:
          type:
          - string
          - 'null'
          description: Sending/receiving warehouse code for stock transfers.
          example: DC1
        reference:
          type:
          - string
          - 'null'
          description: Purchase order number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
          example: ORDER_12345
        order_row:
          type:
          - string
          - 'null'
          description: Purchase order row number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
          example: '1'
        time:
          description: Time of the transaction (24h clock hh:mm)
          $ref: '#/components/schemas/time'
        order_type:
          type:
          - string
          - 'null'
          description: Additional transaction type. E.g. delivery channel for deliveries (from supplier, from DC)
          example: DC
        purchase_price:
          type:
          - number
          - 'null'
          description: Purchase cost of the whole sales transaction
          example: 24
        expiration_date:
          type:
          - string
          - 'null'
          format: date
          description: Expiration date of the goods received.
          example: '2018-06-01'
      required:
      - type
      - product
      - location
      - date
      - quantity
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    delivery:
      $comment: NOTE!! Any changes to this schema MUST BE MADE also in the goods_received.json schema file that contains this schema as a nested property!
      type: object
      properties:
        type:
          type: string
          minLength: 1
          description: Type of the transaction. Always DELIVERY or SPECIAL_DELIVERY.
          example: DELIVERY
          enum:
          - DELIVERY
          - SPECIAL_DELIVERY
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: Transaction posting date.
          example: '2018-06-01'
        quantity:
          type: number
          description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
          example: 24
        transaction_uid:
          type:
          - string
          - 'null'
          description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
          example: TID12345
        value:
          type:
          - number
          - 'null'
          description: Value of the whole transaction in the location's currency (e.g.€, £, $). Value should always be positive. (Transaction quantity determines the direction of the transaction.)
          minimum: 0
          example: 47.76
        reference:
          type:
          - string
          - 'null'
          description: Purchase order number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
          example: ORDER_12345
        order_row:
          type:
          - string
          - 'null'
          description: Purchase order row number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
          example: '1'
        partner_code:
          type:
          - string
          - 'null'
          description: Supplier code for incoming deliveries.
          example: SUPPLIER1
        time:
          description: Time of the transaction (24h clock hh:mm)
          $ref: '#/components/schemas/time'
        order_type:
          type:
          - string
          - 'null'
          description: Additional transaction type. E.g. delivery channel for deliveries (from supplier, from DC)
          example: DC
        purchase_price:
          type:
          - number
          - 'null'
          description: Purchase cost of the whole sales transaction
          example: 24
        expiration_date:
          type:
          - string
          - 'null'
          format: date
          description: Expiration date of the goods received.
          example: '2018-06-01'
      required:
