  /data/transactions/sales_forecasts:
    get:
      tags:
      - Transactions
      summary: Sales Forecasts List
      description: List all the Sales Forecasts available for download. Use query parameter `download_status` to include downloaded data. Filtered out by default.
      operationId: list_GetSalesForecasts
      parameters:
      - description: Filters out data based on their download status. `downloaded` returns data whose download task has been triggered; `all` returns all the data despite of their download status. By default returns data that didn't have any download triggered.
        in: query
        name: download_status
        schema:
          type: string
          enum:
          - all
          - downloaded
        example: all
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/outbound_list_endpoint'
        '400':
          $ref: '#/components/responses/Problem400Response'
        '401':
          $ref: '#/components/responses/Problem401Response'
        '403':
          $ref: '#/components/responses/Problem403Response'
