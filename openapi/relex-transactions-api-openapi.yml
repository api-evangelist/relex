    sale:
      type: object
      properties:
        receipt_timestamp:
          type: string
          format: date-time
          description: Closing time of the receipt.
          example: '2024-05-29T04:12:15.267Z'
        receipt_code:
          type: string
          description: Receipt number for normal sales. In case sales transaction fulfils an open sales order (ecom or B2B), the order number of the sales order
          example: '6547321564'
        date:
          type: string
          minLength: 1
          format: date
          description: Transaction posting date.
          example: '2018-05-01'
        time:
          description: Time of the transaction (24h clock hh:mm)
          pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9])$
          type: string
          example: '15:05'
        location:
          type: string
          description: Location code. Reference to Locations.
          example: LOCATION1
          minLength: 1
        product:
          type: string
          description: Product code. Reference to Products.
          example: PRODUCT1
          minLength: 1
        quantity:
          type: number
          description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
          example: -1
        receipt_row_number:
          type: integer
          minimum: 0
          description: Uniquely identifies the row together with the receipt code. Must be non-negative.
          example: 1234
        value:
          type:
          - number
          - 'null'
          description: Value of the whole transaction in the location's currency (e.g.£, €, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
          minimum: 0
          example: 7.99
        sales_value_with_tax:
          type:
          - number
          - 'null'
          minimum: 0
          description: Value of the whole transaction including sales taxes (VAT) in the location's currency (e.g.€, £, $). Value should always be non-negative. (Transaction quantity determines the direction of the transaction.)
          example: 17
        tax_amount:
          type:
          - number
          - 'null'
          description: The amount of the tax. Used for tax calulcations in Pricing & Promotions, not needed for F&R.
          example: 2
        sales_tax_rate:
          type:
          - number
          - 'null'
          description: Rate of the sales tax, VAT, GST or similar sales-related tax. Used for tax calulcations in Pricing & Promotions, not needed for F&R.
          example: 0.12
        purchase_price:
          type:
          - number
          - 'null'
          description: Purchase cost of sales transaction - this allows sales margin calculation.
          example: 1.99
        loyalty_customer_type:
          type:
          - string
          - 'null'
          description: 'Consumer''s loyalty level, if any. Can have values such as: "No", "Basic", "Gold", "Platinum" but these are not tighly restricted'
          example: Platinum
        fulfillment_type:
          type:
          - string
          - 'null'
          description: The method in which the sale was fulfilled.
          example: Home delivery
        delivery_zip_code:
          type:
          - string
          - 'null'
          description: ZIP (postal) code of the region to which a delivery is made.
          example: '12345'
        loyalty_customer_zip_code:
          type:
          - string
          - 'null'
          description: ZIP (postal) code of the address of a loyalty customer.
          example: '12345'
        campaign_code:
          type:
          - string
          - 'null'
          description: In case sales row includes a campaign discount, code of the related campaign. Can include multiple campaign codes separated by comma (,).
          example: May_discount
        transaction_campaign_code:
          type:
          - string
          - 'null'
          description: Transaction campaign code used for Promotion Planning. In case sales row includes a campaign discount, code of the related campaign. Can include multiple campaign codes separated by comma (,).
          example: May_discount
        original_sales_value:
          type:
          - number
          - 'null'
          description: The list price of the sales row without campaign or other discounts excluding sales tax
          example: 17
        original_sales_value_with_tax:
          type:
          - number
          - 'null'
          description: The list price of the sales row without campaign or other discounts including  sales tax
          example: 20
        promotion_discount:
          type:
          - number
          - 'null'
          description: Promotion/campaign discount %.
          example: 0.21
        transaction_promotion_discount:
          type:
          - number
          - 'null'
          description: Campaign discount used for Promotion Planning
          example: 0.21
        discount:
          type:
          - number
          - 'null'
          description: Non-promotional row discount (%), e.g. markdown or given by sales rep. The reason for the discount can be elaborated in the "Discount reason" field..
          example: 0.12
        discount_reason:
          type:
          - string
          - 'null'
          description: Reason for row discount
          example: Markdown
        checkout_code:
          type:
          - string
          - 'null'
          description: Identifier of the checkout where the sale took place. For example cash or cashier number
          example: '1'
        checkout_type:
          type:
          - string
          - 'null'
          description: Checkout type, e.g. self-service checkout vs cashier staffed checkout vs service desk
          example: Self-service
        partner_code:
          type:
          - string
          - 'null'
          description: 'B2B trading partner to whom goods are sold NOTE: Trading partner must not be individual consumer (i.e. loyalty code), as interface must not contain personal data that may fall under any privacy regulation'
          example: C01234
        order_type:
          type:
          - string
          - 'null'
          description: Additional subtype for sales transactions that can be used to distinct normal sales from special sales and deliveries (e.g. if project sales need to be reported separately from normal sales).
          example: SPECIAL_SALE
          enum:
          - MARKDOWN_SALE
          - SPECIAL_SALE
          - UNUSUAL_SALE
          - null
        row_timestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: Scanning time of an individual product.
          example: '2024-05-29T04:12:15.267Z'
      required:
      - date
      - product
      - location
      - time
      - quantity
      - receipt_code
      - receipt_row_number
      - receipt_timestamp
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
