          type: string
          minLength: 1
          description: Type of the transaction (SALE).
          example: SALE
          enum:
          - SALE
          - SALE_OUT
        sales_quantity:
          type:
          - number
          - 'null'
          description: Sales quantity in base unit of measure (e.g. peices). Quantity sign defines the transaction direction as seen by the location, e.g. outgoing sales is sent as negative quantity. Transaction quantity determines the direction of the transaction.
          example: 1.99
        transaction_uid:
          type:
          - string
          - 'null'
          description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
          example: TID12345
        picking_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: 'Date when delivery for the sales order (type: SALE) was picked from source location.'
          example: '2025-03-03'
        time:
          description: Time of the transaction (24h clock hh:mm)
          $ref: '#/components/schemas/time'
        source_location:
          type:
          - string
          - 'null'
          description: For SALE, the warehouse location from where the goods were delivered to end customer. For SALE_OUT not relevant.
          example: DC123
        sales_value:
          type:
          - number
          - 'null'
          description: Value as of revenue of the whole transaction, in currency defined in currency field, excluding sales taxes (e.g. VAT). Always positive - transaction quantity sign determines the direction of the transaction.
          example: 230
        currency:
          type:
          - string
          - 'null'
          description: Currency of the sales value.
          example: USD
        reference:
          type:
          - string
          - 'null'
          description: Customer (sales) order number related to sale.
          example: S1234567
        order_row:
          type:
          - string
          - 'null'
          description: Customer (sales) order row number related to sale.
          example: '10'
        batch_code:
          type:
          - string
          - 'null'
          description: Batch code. Unique identifier for the sold batch.
          example: B1234
        cost_of_goods_sold:
          type:
          - number
          - 'null'
          description: Cost of goods sold. The standard cost or purchase price of the sales transaction row.
          example: 200
      required:
      - date
      - product
      - end_customer
      - type
      - sales_quantity
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_transfer_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/transfer'
    retail_dc_transaction_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/dc_transaction'
    inbound_meta:
      type: object
      properties:
        timestamp:
          type: integer
          description: Timestamp used to order messages. For example UNIX timestamp in UTC. If there are multiple senders timestamps they generate should be synchronized
          example: 1624437035
        batch_id:
          type: string
          description: A UUID that uniquely identifies this particular request.
          example: 1692c610-6d26-11eb-9439-0242ac130002
          format: uuid
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    accepted:
      type: object
      required:
      - meta
      - data
      properties:
        meta:
          type: object
          properties:
            code:
              type: integer
              description: HTTP status code for the response. Is always in 2xx range for accepted messages
              example: 200
            message:
              type: string
              description: HTTP status message for the response.
              example: OK
            request_id:
              type: string
              description: A UUID that uniquely identifies this particular response for later processing metadata retrieval.
              example: 1692c610-6d26-11eb-9439-0242ac130002
              format: uuid
          $schema: https://json-schema.org/draft/2020-12/schema
          additionalProperties: false
        data:
          type: object
          properties: {}
          additionalProperties: false
    retail_order_proposals:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: /schema/generic_export/proposal-sample/1.json
      type: object
      additionalProperties: false
      required:
      - meta
      - data
      properties:
        meta:
          type: object
          additionalProperties: false
          required:
          - exported_at
          - configured_at
          - primary_resource
          - schema
          default: {}
          title: Response metadata
          properties:
            exported_at:
              type: string
              format: date-time
              title: Exported At
              description: The time the content was exported
              example: '2024-05-29T04:12:15.267Z'
            configured_at:
              type: string
              format: date-time
              title: Configured At
              description: The time the response was configured at the host system. This can be used to detect updates for the schema.
              example: '2023-11-21T08:16:54.908Z'
            primary_resource:
              type: string
              title: Primary Resource
              description: The primary resource for the data
              example: order_proposals
            schema:
              type: string
              title: Schema Path
              description: The schema path for the data
              example: /schema/generic_export/order_proposals/1.json
        data:
          type: array
          additionalProperties: false
          required: []
          title: Data Records
          items:
            type: object
            additionalProperties: false
            properties:
              order_number:
                type: integer
                title: Order number
                description: Row level unique order number. Can be used to identify the order.
                example: 90100
              send_run_id:
                type: integer
                title: Send run id
                description: Run id (number) of the job from which the order proposal row was sent out from RELEX. Can be used for troubleshooting and identifying when a specific order was sent.
                example: 1213
              product_code:
                type: string
                title: Product code
                description: Product code. Identifier of the product.
                example: abc_5648489057
              location_code:
                type: string
                title: Location code
                description: Location code. Identifier of the location/warehouse.
                example: abc_3712470314
              supplier_code:
                type: string
                title: Supplier code
                description: Supplier of the order proposal.
                example: abc_2648891291
              effective_quantity:
                type: number
                title: Effective quantity
                description: Amount of products to be ordered in base unit of measure.
                example: 125
              date:
                type: string
                format: date
                title: Date
                description: Order date, i.e. the date on which the purchase order is created. Current date for normal order proposals, future date for reserve order proposals.
                example: '2024-05-29'
              delivery_date:
                type: string
                format: date
                title: Delivery date
                description: Requested delivery date for goods receival to location/warehouse.
                example: '2024-05-29'
              second_delivery_date:
                type: string
                format: date
                title: Delivery date
                description: Next possible delivery date after the delivery date of current order proposal row for the product-location.
                example: '2024-06-29'
              order_type:
                type: string
                title: Type
                description: 'Defines the type of the order proposal: NORMAL => Normal, SECONDARY => Secondary (i.e. not main delivery date order), EXTRA => Extra order, INITIAL_REPLENISHMENT => Campaign Initial replenishment, ALLOCATION => Allocation, FUTURE_ALLOCATION => Future allocation, FORCEOUT_ALLOCATION => Allocation: Force-out, FORCEOUT_FUTURE_ALLOCATION => Future allocation: Force-out, FILL => Fill, IN_ADVANCE => Order in advance, FUTURE => Reserve order proposal, FUTURE_SECONDARY => Reserve order proposal, secondary order, FUTURE_INITIAL_REPLENISHMENT => Reserve order proposal, campaign initial replenishment, FUTURE_FILL => Reserve order proposal, fill, DAILY => Daily order, DAILY_FILL => Daily fill order, DAILY_SECONDARY => Daily secondary order,PRE_PACK_STARTUP => Prepack startup allocation, PRE_PACK_REPLENISHMENT => Prepack replenishment allocation, PRE_ORDER => Pre-order, EXTERNAL => External order, OTG_MANUAL => Manual order created in RELEX On-the-go Replenishment'
                example: NORMAL
                enum:
                - ALLOCATION
                - DAILY
                - DAILY_FILL
                - DAILY_SECONDARY
                - EXTERNAL
                - EXTRA
                - FILL
                - FORCEOUT_ALLOCATION
                - FORCEOUT_FUTURE_ALLOCATION
                - FUTURE
                - FUTURE_ALLOCATION
                - FUTURE_FILL
                - FUTURE_INITIAL_REPLENISHMENT
                - FUTURE_SECONDARY
                - INITIAL_REPLENISHMENT
                - IN_ADVANCE
                - NORMAL
                - OTG_MANUAL
                - PRE_ORDER
                - PRE_PACK_REPLENISHMENT
                - PRE_PACK_STARTUP
                - SECONDARY
              comment_1:
                type: string
                title: Comment 1
                description: Free comment text 1. Information only, not used in calculations.
                example: comment 1
              comment_2:
                type: string
                title: Comment 2
                description: Free comment text 2. Information only, not used in calculations.
                example: comment 2
    retail_open_purchase_order_request_body:
