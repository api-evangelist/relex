openapi: 3.2.0
info:
  version: v4.28.3
  description: '# API specification


    This documentation describes the data resources and technical details available for the RELEX Data API.'
  title: RELEX Data API for Example Customer Transactions API
  contact:
    email: support@relexsolutions.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: assets/logo.png
    backgroundColor: '#FFFFFF'
    altText: RELEX Logo
servers:
- url: https://uat-eu.rest.relexsolutions.com/restapi-test
- url: https://eu.rest.relexsolutions.com/restapi-test
security:
- OAuth2: []
tags:
- name: Transactions
  description: The namespace for transaction data contains the different endpoints for inventory transactions, balance and open order information.
