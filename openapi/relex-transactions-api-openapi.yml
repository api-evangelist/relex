components:
  schemas:
    retail_batch_balance_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/batch_balance'
    order:
      type: object
      properties:
        product:
          type: string
          description: Product code. Reference to Products.
          example: PRODUCT1
          minLength: 1
        location:
          type: string
          description: Location code. Reference to Locations.
          example: LOCATION1
          minLength: 1
        date:
          type: string
          minLength: 1
          format: date
          description: The order date of the order row. Because it is used as a key its value must not be changed when modifying an order.
          example: '2022-11-08'
        quantity:
          type: number
          description: Quantity currently open to be delivered. Used in order proposal calculation.
          example: 100
        requested_quantity:
          type:
          - number
          - 'null'
          description: Quantity originally requested to be delivered in order row. Typically effective quantity from order proposal row.
          example: 100
        confirmed_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Delivery date confirmed by supplier.
          example: '2022-12-12'
        delivered_quantity:
          type:
          - number
          - 'null'
          description: Quantity that has been delivered for this order row.
          example: 80
        reference:
          type:
          - string
          - 'null'
          minLength: 1
          description: Order (header) reference number
          example: PO4233
        order_row:
          type:
          - string
          - 'null'
          description: Order row number.
          example: '1'
        estimated_date:
          type: string
          minLength: 1
          format: date
          description: Currently expected delivery date.
          example: '2022-12-17'
        requested_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Originally requested delivery date. Typically delivery date from order proposal row according to delivery schedule used in the calculation.
          example: '2022-12-10'
        estimated_delivery_time:
          description: Currently expected delivery time (24h clock hh:mm).
          $ref: '#/components/schemas/time'
        time:
          description: Order time of the order row (24h clock hh:mm).
          $ref: '#/components/schemas/time'
        confirmed_quantity:
          type:
          - number
          - 'null'
          description: Quantity currently open to be delivered. Used in order proposal calculation.
          example: 100
        partner_code:
          type:
          - string
          - 'null'
          minLength: 1
          description: Supplier of the order row
          example: SU4320
        order_type:
          type:
          - string
          - 'null'
          minLength: 1
          description: Free-form text field for defining the order type.
          example: DC_ORDER
        value:
          type:
          - number
          - 'null'
          description: Monetary value (in currency) of the order row.
          example: 200
        delivered_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Actual realized date when order row was delivered.
          example: '2022-12-14'
        status:
          type:
          - string
          - 'null'
          minLength: 1
          description: Status of the order row.
          example: OPEN
          enum:
          - CLOSED
          - CONFIRMED
          - OPEN
          - PARTIALLY_DELIVERED
          - null
        expiration_date:
          type:
          - string
          - 'null'
          minLength: 1
          format: date
          description: Expiration date of the goods to be received.
          example: '2023-06-06'
      required:
      - product
      - location
      - date
      - quantity
      - estimated_date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_order_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/order'
    problem_details_400:
      description: Implementation of [RFC7807](https://tools.ietf.org/html/rfc7807) Problem Details object.  Content type should always be ```application/problem+json```.  Problem type definitions MAY extend the problem details object with additional members
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          description: A URI reference [RFC3986] that identifies the problem type.
          type: string
          format: uri
          example: https://relexsolutions.com/rest/errors/400
        title:
          description: A short, human-readable summary of the problem type.
          type: string
          example: Bad Request
        status:
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          type: number
          example: 400
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
          example: validating the payload's JSON schema failed
        debugging:
          description: Debugging information for DEV and QA environments.
          type: string
        validation_errors:
          type: array
          description: A list of issues that exist with the request.
          items:
            type: object
            properties:
              location:
                type: string
              message:
                type: string
              violation:
                type: string
          example:
          - location: /data/0
            message: 'missing properties: ''code'''
            violation: required
          - location: /meta/example
            message: expected string, but got number
            violation: type
    outbound_list_endpoint:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        meta:
          type: object
          properties:
            type:
              type: string
              description: Type of the export
              example: data.namespace.custom_export_resource.available
            requested_at:
              type: string
              description: A timestamp of the moment the request was served
              example: '2024-06-12T07:03:41+00:00'
          required: []
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: File identifier
                example: 43ee6e0c-6341-418f-a4e9-4029ec86f16a
              timestamp:
                type: string
                description: The time when the file was exported
                example: '2024-05-29T04:12:16.102371Z'
              downloaded:
                type: string
                description: Has the file been tried to download before. Set to 'false' upon file creation. A successful start of a download sets this to 'true'.
                example: 'false'
              url:
                type: string
                description: URL-path of the file. Use this when downloading.
                example: /data/namespace/custom_export_resource/43ee6e0c-6341-418f-a4e9-4029ec86f16a
              resource:
                type: string
                description: Resource name
                example: custom_export_resource
            required: []
      required: []
    inbound_meta:
      type: object
      properties:
        timestamp:
          type: integer
          description: Timestamp used to order messages. For example UNIX timestamp in UTC. If there are multiple senders timestamps they generate should be synchronized
          example: 1624437035
        batch_id:
          type: string
          description: A UUID that uniquely identifies this particular request.
          example: 1692c610-6d26-11eb-9439-0242ac130002
          format: uuid
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    dc_transaction:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: Transaction posting date.
          example: '2018-07-01'
        sales_orders_quantity:
          type: number
          description: 'Only for type: OPEN_SALES_ORDER. Open order quantity in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit). Quantity sign defines the transaction direction as seen by the warehouse, so open sales order is sent as negative quantity.'
          exclusiveMaximum: 0
          example: -2
        sales_orders_value:
          type:
          - number
          - 'null'
          description: 'Only for type: OPEN_SALES_ORDER. Value of the whole transaction in the location''s currency (e.g. €, £, $). Value should always be positive as transaction quantity determines the direction of the transaction. Value suggestion: Sales value excluding tax. If the sales order is internal sale, the value should be the internal sales value used for the transaction'
          minimum: 0
          example: 3.98
        balance:
          type:
          - number
          - 'null'
          description: 'Only for type: BALANCE or BATCH_BALANCE. Physical balance quantity in the location in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit). Balance quantity should be always positive and possible reservations are send as open sales orders.'
          minimum: 0
          example: 50
        estimated_date:
          type: string
          minLength: 1
          format: date
          description: 'For type SALES_ORDER: Requested/confirmed outbound delivery date. The date must reflect the time when the stock must be available for fulfilling an order. It does not reflect the actual date when the goods are delivered to the customer. For type BATCH_BALANCE: Last valid date ("Best before date") for the batch. Batch balance is expected to become non-sellable at the end of this date.'
          example: '2018-07-01'
        type:
          type: string
          minLength: 1
          description: Type of the transaction. Must be one of BALANCE, BATCH_BALANCE or SALES_ORDER (=open sales order).
          example: BALANCE
          enum:
          - BALANCE
          - BATCH_BALANCE
          - SALES_ORDER
        time:
          description: If balances are sent multiple times during the day, indicates the time (24h clock hh:mm) of the balance or batch balance information, i.e. when it was fetched from source system
          $ref: '#/components/schemas/time'
