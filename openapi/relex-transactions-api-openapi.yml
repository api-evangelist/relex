      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/retail_adjustment_request_body'
        required: true
      tags:
      - Transactions
      summary: Adjustments
      description: Inventory balance correction, similar to inventory check transaction.
      operationId: PostAdjustments
      parameters:
      - $ref: '#/components/parameters/HttpHeader'
      responses:
        '200':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/Problem400Response'
        '401':
          $ref: '#/components/responses/Problem401Response'
        '403':
          $ref: '#/components/responses/Problem403Response'
        '404':
          $ref: '#/components/responses/Problem404Response'
        '413':
          $ref: '#/components/responses/Problem413Response'
        '429':
