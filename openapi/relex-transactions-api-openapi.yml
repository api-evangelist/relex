          description: Value of the whole transaction in the location's currency (e.g. €, £, $). Value should always be positive as transaction quantity determines the direction of the transaction. Usually based on purchase price. Negative values are automatically converted to the positive absolute value of the inserted value.
          minimum: 0
          example: 5.97
        time:
          description: If batch balances are sent multiple times during the day, indicates the time when balance was fetched from source system
          $ref: '#/components/schemas/time'
        estimated_date:
          type: string
          minLength: 1
          format: date
          description: Last valid date ('Best before date') for the batch. Batch balance is expected to become non-sellable at the end of this date. Forecasted spoilage in RELEX takes also product-location's required remaining shelf life into account (effective spoiling date = 'estimated_date' - 'required remaining shelf life').
          example: '2018-10-05'
        batch_manufacturing_date:
          type:
          - string
          - 'null'
          format: date
          description: Date of manufacture of the batch. Only relevant for manufacturing customers.
          example: '2018-10-05'
        batch_code:
          type:
          - string
          - 'null'
          description: Unique identifier for the manufactured batch. Only relevant for manufacturing customers.
          example: MB103938485
        production_date:
          type:
          - string
          - 'null'
          format: date
          description: Production date. The date when the batch was produced.
          example: '2025-03-01'
        available_date:
          type:
          - string
          - 'null'
          format: date
          description: Available date. When the batch is in quality control or ageing, the date when it is expected to be available for sale and consumption.
          example: '2025-09-09'
      required:
      - type
      - product
      - location
      - date
      - balance
      - estimated_date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_balance_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/balance'
    retail_open_sales_order_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/open_sales_order'
    retail_inventory_check_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/inventory_check'
    retail_open_purchase_order_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/open_purchase_order'
    time:
      pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9])$
      type:
      - string
      - 'null'
      example: '15:05'
    inventory_event:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        balances:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - balance
            properties:
              type:
                type: string
                minLength: 1
                description: 'Supported balance types are: BALANCE = Current physical stock level'
                example: BALANCE
                enum:
                - BALANCE
              date:
                type: string
                minLength: 1
                format: date
                description: Balance date i.e. date of the product-location balance. Previous day's date in the daily transfer. For historical balances the date of the balance.
                example: '2018-09-30'
              balance:
                type: number
                description: Physical balance quantity in the location in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit). Balance quantity should be always positive and possible reservations are send as open sales orders.
                example: 15
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g. €, £, $). Value should always be positive as transaction quantity determines the direction of the transaction. Usually based on purchase price. Negative values are automatically converted to the positive absolute value of the inserted value.
                minimum: 0
                example: 29.85
              time:
                description: If balances are sent multiple times during the day, indicates the time of the balance information, i.e. when it was fetched from source system
                $ref: '#/components/schemas/time'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
        sales:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - time
            - quantity
            properties:
              type:
                type: string
                minLength: 1
                description: Always SALE.
                example: SALE
                enum:
                - SALE
              date:
                type: string
                minLength: 1
                format: date
                description: Transaction posting date.
                example: '2018-05-01'
              quantity:
                type: number
                description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: -1
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g.£, €, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
                minimum: 0
                example: 7.99
              time:
                description: Time of the transaction (24h clock hh:mm)
                pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9])$
                type: string
                example: '15:05'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
        open_sales_orders:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - quantity
            - estimated_date
            properties:
              type:
                type: string
                minLength: 1
                description: SALES_ORDER = Open sales order
                example: SALES_ORDER
                enum:
                - SALES_ORDER
              date:
                type: string
                minLength: 1
                format: date
                description: Snapshot's date. The open order row has to be received every day the order remains open. Once it's delivered, the open order row is not sent anymore. For example, if an order is created on Jan 3rd and the snapshot date is Jan 8th, then the date field will contain '2018-01-08' assuming the order is still open Jan 8th. Snapshot's date is usually previous day's date except if reading in historical open orders.
                example: '2018-07-02'
              quantity:
                type: number
                description: Open order quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales order is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: -2
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g.€, £, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
                minimum: 0
                example: 17.98
              transaction_uid:
                type:
                - string
                - 'null'
                description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
                example: TID12345
              estimated_date:
                type: string
                format: date
                description: Estimated delivery date of the order.
                example: '2018-07-04'
              order_requested_date:
                type:
                - string
                - 'null'
                format: date
                description: Requested delivery date of the order. Can be used for measuring delivery accuracy.
                example: '2019-07-03'
              reference:
                type:
                - string
                - 'null'
                description: Sales order number. RELEX uses reference code and order row from Sale & Open sales order in calculating supplier delivery accuracy metrics.
                example: SO_12345
              order_row:
                type:
                - string
                - 'null'
                description: Sales order row number. RELEX uses reference code and order row from Sale & Open sales order in calculating supplier delivery accuracy metrics.
                example: '2'
              order_type:
                type:
                - string
                - 'null'
                description: Additional order type that can be used to distinct normal open orders from special open orders. Special orders are skipped in replenishment calculations. Consider not using these types of orders.
                example: SPECIAL_SALES_ORDER
              partner_code:
                type:
                - string
                - 'null'
                description: Customer code for sales orders.
                example: C01234
              estimated_delivery_time:
                description: Estimated delivery time (24h clock hh:mm)
                $ref: '#/components/schemas/time'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
        deliveries:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - quantity
            properties:
              type:
                type: string
                minLength: 1
                description: Type of the transaction. Always DELIVERY or SPECIAL_DELIVERY.
                example: DELIVERY
                enum:
                - DELIVERY
                - SPECIAL_DELIVERY
              date:
                type: string
                minLength: 1
                format: date
                description: Transaction posting date.
                example: '2018-06-01'
              quantity:
                type: number
                description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: 24
              transaction_uid:
                type:
                - string
                - 'null'
                description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
                example: TID12345
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g.€, £, $). Value should always be positive. (Transaction quantity determines the direction of the transaction.)
                minimum: 0
                example: 47.76
              reference:
                type:
                - string
                - 'null'
                description: Purchase order number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
                example: ORDER_12345
              order_row:
                type:
                - string
                - 'null'
                description: Purchase order row number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
                example: '1'
              partner_code:
                type:
                - string
                - 'null'
                description: Supplier code for incoming deliveries.
                example: SUPPLIER1
              time:
                description: Time of the transaction (24h clock hh:mm)
                $ref: '#/components/schemas/time'
              order_type:
                type:
                - string
                - 'null'
                description: Additional transaction type. E.g. delivery channel for deliveries (from supplier, from DC)
                example: DC
              purchase_price:
                type:
                - number
                - 'null'
                description: Purchase cost of the whole sales transaction
                example: 24
              expiration_date:
                type:
                - string
                - 'null'
                format: date
                description: Expiration date of the goods received.
                example: '2018-06-01'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
        open_purchase_orders:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - quantity
            - estimated_date
            properties:
              type:
                type: string
                minLength: 1
                description: ORDER = Open purchase order (can be linked to DELIVERY with a reference number)
                example: ORDER
                enum:
                - ORDER
              date:
                type: string
                minLength: 1
                format: date
                description: Snapshot's date. The open order row has to be received every day the order remains open. Once it's delivered, the open order row is not sent anymore. For example, if an order is created on Jan 3rd and the snapshot date is Jan 8th, then the date field will contain '2018-01-08' assuming the order is still open Jan 8th. Snapshot's date is usually previous day's date except if reading in historical open orders.
                example: '2018-05-25'
              quantity:
                type: number
                description: Open order quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. incoming purchase order is sent as positive quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: 24
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g.€, £, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
                minimum: 0
                example: 47.76
              estimated_date:
                type: string
                format: date
                description: Estimated delivery date of the order.
                example: '2018-06-01'
              order_requested_date:
                type:
                - string
                - 'null'
                format: date
                description: Requested delivery date of the order. Can be used for measuring delivery accuracy.
                example: '2019-07-03'
              reference:
                type:
                - string
                - 'null'
                description: Purchase order number. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
                example: ORDER_12345
              order_row:
                type:
                - string
                - 'null'
                description: Purchase order row number. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
                example: '1'
              order_proposal_reference:
                type:
                - number
                - 'null'
                description: RELEX order proposal reference number. The order proposal number sent by RELEX to track open purchase orders.
                example: 5314130
              transaction_uid:
                type:
                - string
                - 'null'
                description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
                example: TID12345
              order_type:
                type:
                - string
                - 'null'
                description: Additional order type that can be used to distinct normal open orders from special open orders.
                example: SPECIAL_PURCHASE_ORDER
              partner_code:
                type:
                - string
                - 'null'
                description: Supplier code for purchase orders.
                example: SUPPLIER1
              estimated_delivery_time:
                description: Estimated delivery time (24h clock hh:mm)
                $ref: '#/components/schemas/time'
              expiration_date:
                type:
                - string
                - 'null'
                format: date
                description: Expiration date of the goods to be received.
                example: '2020-09-18'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
        adjustments:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - quantity
            properties:
              type:
                type: string
                minLength: 1
                description: Type of the transaction. Always ADJUSTMENT.
                example: ADJUSTMENT
                enum:
                - ADJUSTMENT
              date:
                type: string
                minLength: 1
                format: date
                description: Transaction posting date.
                example: '2018-09-16'
              quantity:
                type: number
                description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: 1
              transaction_uid:
                type:
                - string
                - 'null'
                description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
                example: TID12345
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g. €, £, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
                minimum: 0
                example: 1.99
              time:
                description: Time of the transaction (24h clock hh:mm)
                $ref: '#/components/schemas/time'
              partner_code:
                type:
                - string
                - 'null'
                description: 'Defines the partner related to the transaction, usually: -Sales transactions: Customer; -Incoming deliveries: Supplier; -Stock transfers: Sending/receiving warehouse'
                example: SUPPLIER1
              reference:
                type:
                - string
                - 'null'
                description: Sales or purchase order number related to sale or goods receival transaction.
                example: ORDER_12345
              order_row:
                type:
                - string
                - 'null'
                description: Sales or purchase order row number related to sale or goods receival transaction.
                example: '1'
              order_type:
                type:
                - string
                - 'null'
                description: Additional transaction type. E.g. delivery channel for deliveries (from supplier, from DC)
                example: DC
              expiration_date:
                type:
                - string
                - 'null'
                format: date
                description: Expiration date of the goods received.
                example: '2018-06-01'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
      required:
