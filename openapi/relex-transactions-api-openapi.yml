    problem_details_general:
      description: Implementation of [RFC7807](https://tools.ietf.org/html/rfc7807) Problem Details object.  Content type should always be ```application/problem+json```.  Problem type definitions MAY extend the problem details object with additional members
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          description: A URI reference [RFC3986] that identifies the problem type.
          type: string
          format: uri
          example: https://relexsolutions.com/issue
        title:
          description: A short, human-readable summary of the problem type.
          type: string
          example: Bad Request
        status:
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          type: number
          example: 400
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
    open_purchase_order:
      $comment: NOTE!! Any changes to this schema MUST BE MADE also in the goods_received.json schema file that contains this schema as a nested property!
      type: object
      properties:
        type:
          type: string
          minLength: 1
          description: ORDER = Open purchase order (can be linked to DELIVERY with a reference number)
          example: ORDER
          enum:
          - ORDER
        product:
          type: string
          minLength: 1
          description: Product code (code for finished product or stock keeping unit). Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Inventory location code (i.e. for affected store, warehouse etc.). Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: Snapshot's date. The open order row has to be received every day the order remains open. Once it's delivered, the open order row is not sent anymore. For example, if an order is created on Jan 3rd and the snapshot date is Jan 8th, then the date field will contain '2018-01-08' assuming the order is still open Jan 8th. Snapshot's date is usually previous day's date except if reading in historical open orders.
          example: '2018-05-25'
        quantity:
          type: number
          description: Open order quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. incoming purchase order is sent as positive quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
          example: 24
        value:
          type:
          - number
          - 'null'
          description: Value of the whole transaction in the location's currency (e.g.€, £, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
          minimum: 0
          example: 47.76
        estimated_date:
          type: string
          format: date
          description: Estimated delivery date of the order.
          example: '2018-06-01'
        order_requested_date:
          type:
          - string
          - 'null'
          format: date
          description: Requested delivery date of the order. Can be used for measuring delivery accuracy.
          example: '2019-07-03'
        reference:
          type:
          - string
          - 'null'
          description: Purchase order number. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
          example: ORDER_12345
        order_row:
          type:
          - string
          - 'null'
          description: Purchase order row number. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
          example: '1'
        order_proposal_reference:
          type:
          - number
          - 'null'
          description: RELEX order proposal reference number. The order proposal number sent by RELEX to track open purchase orders.
          example: 5314130
        transaction_uid:
          type:
          - string
          - 'null'
          description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
          example: TID12345
        order_type:
          type:
          - string
          - 'null'
          description: Additional order type that can be used to distinct normal open orders from special open orders.
          example: SPECIAL_PURCHASE_ORDER
        partner_code:
          type:
          - string
          - 'null'
          description: Supplier code for purchase orders.
          example: SUPPLIER1
        estimated_delivery_time:
          description: Estimated delivery time (24h clock hh:mm)
          $ref: '#/components/schemas/time'
        expiration_date:
          type:
          - string
          - 'null'
          format: date
          description: Expiration date of the goods to be received.
          example: '2020-09-18'
      required:
      - type
      - product
      - location
      - date
      - quantity
      - estimated_date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_inventory_check_request_body:
      type: object
      required:
      - data
      additionalProperties: false
