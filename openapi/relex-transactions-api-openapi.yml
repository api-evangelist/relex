    open_sales_order:
      type: object
      properties:
        type:
          type: string
          minLength: 1
          description: SALES_ORDER = Open sales order
          example: SALES_ORDER
          enum:
          - SALES_ORDER
        product:
          type: string
          minLength: 1
          description: Product code (code for finished product or stock keeping unit). Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Inventory location code (i.e. for affected store, warehouse etc.). Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: Snapshot's date. The open order row has to be received every day the order remains open. Once it's delivered, the open order row is not sent anymore. For example, if an order is created on Jan 3rd and the snapshot date is Jan 8th, then the date field will contain '2018-01-08' assuming the order is still open Jan 8th. Snapshot's date is usually previous day's date except if reading in historical open orders.
          example: '2018-07-02'
        quantity:
          type: number
          description: Open order quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales order is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
          example: -2
        value:
          type:
          - number
          - 'null'
          description: Value of the whole transaction in the location's currency (e.g.€, £, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
          minimum: 0
          example: 17.98
        transaction_uid:
          type:
          - string
          - 'null'
          description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
          example: TID12345
        estimated_date:
          type: string
          format: date
          description: Estimated delivery date of the order.
          example: '2018-07-04'
        order_requested_date:
          type:
          - string
          - 'null'
          format: date
          description: Requested delivery date of the order. Can be used for measuring delivery accuracy.
          example: '2019-07-03'
        reference:
          type:
          - string
          - 'null'
          description: Sales order number. RELEX uses reference code and order row from Sale & Open sales order in calculating supplier delivery accuracy metrics.
          example: SO_12345
        order_row:
          type:
          - string
          - 'null'
          description: Sales order row number. RELEX uses reference code and order row from Sale & Open sales order in calculating supplier delivery accuracy metrics.
          example: '2'
        order_type:
          type:
          - string
          - 'null'
          description: Additional order type that can be used to distinct normal open orders from special open orders. Special orders are skipped in replenishment calculations. Consider not using these types of orders.
          example: SPECIAL_SALES_ORDER
        partner_code:
          type:
          - string
          - 'null'
          description: Customer code for sales orders.
          example: C01234
        estimated_delivery_time:
          description: Estimated delivery time (24h clock hh:mm)
          $ref: '#/components/schemas/time'
      required:
      - type
      - product
      - location
      - date
      - quantity
      - estimated_date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
