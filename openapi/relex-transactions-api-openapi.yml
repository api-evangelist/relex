      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_sale_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/sale'
    goods_received:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        balances:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - balance
            properties:
              type:
                type: string
                minLength: 1
                description: Type of the transaction. Always BALANCE.
                example: BALANCE
                enum:
                - BALANCE
              date:
                type: string
                minLength: 1
                format: date
                description: The date of the recorded balance quantity. Usually previous day's date except if reading in historical balances.
                example: '2018-09-30'
              balance:
                type: number
                description: Physical balance quantity in the location in base unit of measure (e.g. pieces). RELEX calculates unreserved balance based on physical balance and open orders. Balance quantity should be always positive and possible reservations can be send as open sales orders. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: 15
              value:
                type:
                - number
                - 'null'
                description: Book value of total quantity of the balance entry. Alternatively if book value is not available, the purchase value of the balance quantity can be used.
                minimum: 0
                example: 29.85
              time:
                description: Time of the transaction (24h clock hh:mm)
                pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9])$
                type:
                - string
                - 'null'
                example: '15:05'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
        deliveries:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - quantity
            properties:
              type:
                type: string
                minLength: 1
                description: Type of the transaction. Always DELIVERY or SPECIAL_DELIVERY.
                example: DELIVERY
                enum:
                - DELIVERY
                - SPECIAL_DELIVERY
              date:
                type: string
                minLength: 1
                format: date
                description: Transaction posting date.
                example: '2018-06-01'
              quantity:
                type: number
                description: Transaction quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. outgoing sales is sent as negative quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: 6
              transaction_uid:
                type:
                - string
                - 'null'
                description: Transaction UID. Unique identifier for transaction row. Can be used as key for updates to the row.
                example: TID12345
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g. €, £, $). Value should always be positive. (Transaction quantity determines the direction of the transaction.)
                minimum: 0
                example: 47.76
              reference:
                type:
                - string
                - 'null'
                description: Purchase order number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
                example: ORDER_12345
              order_row:
                type:
                - string
                - 'null'
                description: Purchase order row number related to goods receival transaction. RELEX uses reference code and order row from Delivery & Open purchase order in calculating supplier delivery accuracy metrics.
                example: '1'
              partner_code:
                type:
                - string
                - 'null'
                description: Supplier code for incoming deliveries.
                example: SUPPLIER1
              time:
                description: Time of the transaction (24h clock hh:mm)
                pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9])$
                type:
                - string
                - 'null'
                example: '15:05'
              order_type:
                type:
                - string
                - 'null'
                description: Additional transaction type. E.g. delivery channel for deliveries (from supplier, from DC)
                example: DC
              purchase_price:
                type:
                - number
                - 'null'
                description: Purchase cost of the whole sales transaction
                example: 24
              expiration_date:
                type:
                - string
                - 'null'
                format: date
                description: Expiration date of the goods received.
                example: '2018-06-01'
            $schema: https://json-schema.org/draft/2020-12/schema
            additionalProperties: false
        open_purchase_orders:
          type: array
          items:
            type: object
            required:
            - type
            - date
            - quantity
            - estimated_date
            properties:
              type:
                type: string
                minLength: 1
                description: ORDER = Open purchase order (can be linked to DELIVERY with a reference number)
                example: ORDER
                enum:
                - ORDER
              date:
                type: string
                minLength: 1
                format: date
                description: Snapshot's date. The open order row has to be received every day the order remains open. Once it's delivered, the open order row is not sent anymore. For example, if an order is created on Jan 3rd and the snapshot date is Jan 8th, then the date field will contain '2018-01-08' assuming the order is still open Jan 8th. Snapshot's date is usually previous day's date except if reading in historical open orders.
                example: '2018-05-25'
              quantity:
                type: number
                description: Open order quantity in inventory units (e.g. pieces). Quantity sign defines the transaction direction as seen by the warehouse, e.g. incoming purchase order is sent as positive quantity. All quantities should be given in base unit of measure (e.g. SKU, stock unit, piece, smallest possible unit).
                example: 0
              value:
                type:
                - number
                - 'null'
                description: Value of the whole transaction in the location's currency (e.g. €, £, $). Value should always be positive. Transaction quantity determines the direction of the transaction.
                minimum: 0
                example: 47.76
              estimated_date:
