        original_sales_value_with_tax:
          type:
          - number
          - 'null'
          description: The list price of the sales row without campaign or other discounts including  sales tax
          example: 20
        promotion_discount:
          type:
          - number
          - 'null'
          description: Promotion/campaign discount %.
          example: 0.21
        transaction_promotion_discount:
          type:
          - number
          - 'null'
          description: Campaign discount used for Promotion Planning
          example: 0.21
        discount:
          type:
          - number
          - 'null'
          description: Non-promotional row discount (%), e.g. markdown or given by sales rep. The reason for the discount can be elaborated in the "Discount reason" field..
          example: 0.12
        discount_reason:
          type:
          - string
          - 'null'
          description: Reason for row discount
          example: Markdown
