      - description: Identifier of data to download.
        in: path
        name: id
        required: true
        schema:
          type: string
        example: 12345678-abcd-efgh-4321-787878787878
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retail_sales_forecasts'
        '400':
          $ref: '#/components/responses/Problem400Response'
        '401':
          $ref: '#/components/responses/Problem401Response'
