        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_delete_batch_size'
    problem_details_general:
      description: Implementation of [RFC7807](https://tools.ietf.org/html/rfc7807) Problem Details object.  Content type should always be ```application/problem+json```.  Problem type definitions MAY extend the problem details object with additional members
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          description: A URI reference [RFC3986] that identifies the problem type.
          type: string
          format: uri
          example: https://relexsolutions.com/issue
        title:
          description: A short, human-readable summary of the problem type.
          type: string
          example: Bad Request
        status:
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          type: number
          example: 400
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          type: string
    retail_product_location_delivery_schedule_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_product_location_delivery_schedule'
    retail_supplier_location_closure:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        supplier:
          type: string
          minLength: 1
          description: Supplier code. Reference to Suppliers.
          example: SUPPLIER1
        date:
          type: string
          minLength: 1
          format: date
          description: Supplier closed date. Each supplier closed date needs to have a row and it is not possible to define this by a range.
          example: '2024-09-23'
        closed:
          type: boolean
          description: Defines if supplier is open or closed.
          example: true
      required:
      - location
      - supplier
      - date
      - closed
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_barcode_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_barcode'
    retail_delete_product_replacement_and_reference_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_delete_product_replacement_and_reference'
    retail_product_location_batch_size:
      type: object
      properties:
        product_batch_size:
          type: string
          minLength: 1
          description: Code for the product batch-size. Can be created by concatenating the product code and the batch size, e.g. "PRODUCT1/2.0", or the description, e.g. "PRODUCT1/Box".
          example: PRODUCT1/Box
        product:
          type: string
          minLength: 1
          description: Product code. Reference to products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to locations.
          example: LOCATION1
        valid:
          type: boolean
          description: 'Validity setting: -true= product-location-batch size is valid and can be used; -false = product-location-batch size is not valid, and can not be used.'
          example: true
        validity_date_type:
          type:
          - string
          - 'null'
          minLength: 1
          description: Start and end date defined either as ORDERS or DELIVERIES.
          example: ORDERS
          enum:
          - DELIVERIES
          - ORDERS
          - null
        validity_start_date:
          type:
          - string
          - 'null'
          format: date
          description: Start of validity period for batch size. Note that the field valid needs to be set as true.
          example: '2019-01-01'
        validity_end_date:
          type:
          - string
          - 'null'
          format: date
          description: End of validity period for batch size. Note that the field valid needs to be set as true.
          example: '2019-12-31'
        batch_trigger_level:
          type:
          - number
          - 'null'
          description: Bath trigger level % for the product-location-batch size. Batch size is rounded down to nearest multiple if order need is less than trigger level % over the previous batch size multiple.
          example: 50.1
        percentage_limit:
          type:
          - number
          - 'null'
          description: ' Percentage limit % for the product-location-batch size. Batch size is used for an order (or as the 1st batch size for an order) if: order need >= percentage limit * batch size  '
          example: 0.5
        supplier_code:
          type:
          - string
          - 'null'
          description: Supplier for a product-location-batch size. Use this field to set a supplier for a product-location in a store if same product can be ordered to a store in multiple batch sizes (one batch size corresponding to one DC product), and different batch sizes are ordered from different DCs.
          example: SUPPLIER1
      required:
      - product_batch_size
      - product
      - location
      - valid
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_delete_product_location_delivery_schedule:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Product code. Reference to products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to locations.
          example: LOCATION1
        delivery_schedule:
          type: string
          minLength: 1
          description: Delivery schedule code. Reference to delivery schedules.
          example: 2017-01-01-2019-01-01_ABCDE
      required:
      - product
      - location
      - delivery_schedule
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_country_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_country'
    retail_delete_location_supplier_delivery_schedule_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_delete_location_supplier_delivery_schedule'
    time:
      pattern: ^(2[0-3]|[01]?[0-9]):([0-5]?[0-9])$
      type:
      - string
      - 'null'
      example: '15:05'
    retail_product_end_customer_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_product_end_customer'
    retail_bill_of_materials:
      type: object
      properties:
        end_product_code:
          type: string
          minLength: 1
          description: Item code of the produced product. Reference to products.
          example: PRODUCT1
        component_product_code:
          type: string
          minLength: 1
          description: Item code of the component product consumed in the production of the end product. Reference to products.
          example: COMPONENT1
        end_location_code:
          type:
          - string
          - 'null'
          minLength: 1
          description: Location code of the produced end product. Needed in case components are consumed from a location different to where the end product is produced, and in case locations have different bill-of-materials for an end product. Reference to locations.
          example: LOCATION1
        component_location_code:
          type:
          - string
          - 'null'
          minLength: 1
          description: Location code of the component product. Needed if end_location_code given. Reference to locations.
          example: LOCATION2
        quantity:
          type: number
          description: Amount of components consumed in producing one base unit of the end product.
          example: 2
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: The first day when the bill of materials is considered in calculations.
          example: '2018-01-01'
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: The last day when the bill of materials is considered in calculations.
          example: '2018-12-31'
        active:
          type: boolean
          description: Only active records are considered in bill of materials.
          example: true
        yield_percentage:
          type:
          - number
          - 'null'
          description: Yield is the percentage of the component product that is effectively utilized for the end product after yield loss.
          example: 2
        yield_quantity:
          type:
          - number
          - 'null'
          description: Yielded quantity is the quantity of the component product that is effectively utilized for the end product after yield loss.
          example: 1
      required:
      - end_product_code
      - component_product_code
      - quantity
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_bill_of_materials_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_bill_of_materials'
    retail_constraint_group_constraint:
      type: object
      properties:
        constraint_group:
          type: string
          minLength: 1
          description: Constraint group code.
          example: GROUP_1
        date:
          type: string
          format: date
          description: Date of constraint.
          example: '2018-01-01'
        static_minimum:
          type:
          - number
          - 'null'
          description: Static minimum constraint. The minimum amount that must be ordered/delivered for a group on a certain date.
          example: 25
        static_maximum:
          type:
          - number
          - 'null'
          description: Static maximum constraint. The maximum amount that can be ordered/delivered for a group on a certain date.
          example: 50
        exact:
          type:
          - number
          - 'null'
          description: Exact constraint. The exact amount that should be ordered/delivered for a group on a certain date.
          example: 25
        reserved_amount:
          type:
          - number
          - 'null'
          description: Fixed quantity ordered or delivered that consumes constraints in constrained replenishment. This amount is considered in constraints before any new order proposals or projections are calculated. Only positive values are considered.
          example: 5
      required:
      - constraint_group
      - date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_chain:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Chain code.
          example: EAST-MEDIUM
        name:
          type: string
          description: Chain name.
          example: Grocery stores inc.
        country:
          type:
          - string
          - 'null'
          description: Country to which a chain belongs to is defined in a Chain file
          example: COUNTRY1
      required:
      - code
      - name
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_floor_plan:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Identifier of the floor plan.
          example: '101234'
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: Start date. If omitted, only one floor plan is in effect at a time.
          example: '2021-01-01'
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: End date. If omitted, only one floor plan is in effect at a time
          example: '2021-03-31'
        status:
          type:
          - string
          description: 'Status if the floor plan. Possible values: LIVE, PLANNED, ARCHIVED'
          example: LIVE
          enum:
          - ARCHIVED
          - LIVE
          - PLANNED
      required:
      - code
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
  responses:
    Problem404Response:
      description: Page Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem_details_general'
          example:
            type: https://relexsolutions.com/rest/errors/404
            title: Page Not Found
            status: 404
    Problem403Response:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem_details_general'
          example:
            type: https://relexsolutions.com/rest/errors/403
            title: Forbidden
            status: 403
    Problem400Response:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem_details_400'
    Problem413Response:
      description: Content Too Large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem_details_general'
          example:
            type: https://relexsolutions.com/rest/errors/413
            title: Payload Too Large
            status: 413
            detail: Payload was larger than 1mb
    Problem401Response:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem_details_general'
          example:
            type: https://relexsolutions.com/rest/errors/401
            title: Unauthorized
            status: 401
    Problem5xxResponse:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem_details_general'
          example:
            type: https://relexsolutions.com/rest/errors/500
            title: An internal error occurred.
            status: 500
            detail: The server is unable to process the request.
    Accepted:
      description: 'Accepted: Request was accepted. Data is forwarded for further processing.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/accepted'
    Problem429Response:
      description: Too Many Requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/problem_details_general'
          example:
            type: https://relexsolutions.com/rest/errors/429
            title: Too Many Requests
            status: 429
            detail: 'Rate limit has been exceeded: The request could not be completed due to the client exceeding the request limit.'
  parameters:
    HttpHeader:
      in: header
      name: Content-Type
      description: The media type in the Content-Type header must be specified and must be _application/json_. The character encoding of the data is expected to be UTF-8.
      required: true
      example: application/json
      schema:
        type: string
  securitySchemes:
    OAuth2:
      type: oauth2
      description: The RELEX Data API uses OAuth 2 with the client credentials flow.
      flows:
        clientCredentials:
          tokenUrl: https://identity.prod-eu.prod.cc.relexsolutions.com/login/restapi_prod/connect/token
          scopes:
            openid_api: Internal use
x-tagGroups:
- name: Endpoints
  tags:
  - Metadata
  - Master data
  - Transactions
  - Custom
- name: Customizations
  tags:
  - Customizations
