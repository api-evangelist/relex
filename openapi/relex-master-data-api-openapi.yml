    retail_product_location_supplier:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: '5789'
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: DC001
        supplier:
          type: string
          minLength: 1
          description: Supplier code. Reference to Suppliers.
          example: S1400
        batch_size:
          type:
          - number
          - 'null'
          description: Batch size for supplier of product-location.
          example: 10
        preferred:
          type: boolean
          description: Set to true if it's the preferred supplier.
          example: true
        minimum_delivery_batch:
          type:
          - number
          - 'null'
          description: Number of inventory units that must be ordered at minimum.
          example: 150
        erp_reference:
          type:
          - string
          - 'null'
          description: ERP document reference.
          example: '20004567'
        purchase_batch_unit:
          type:
          - string
          - 'null'
          description: Purchase batch unit. Inventory unit of the purchase batch size.
          example: BOX
        supplier_subcategory:
          type:
          - string
          - 'null'
          description: Supplier subcategory. Additional subcategory for supplier.
          example: Cold cuts
        alternative_product_code:
          type:
          - string
          - 'null'
          description: Alternative product code. Supplier's product code
          example: P1111
        availability_start:
          type:
          - string
          - 'null'
          format: date
          description: Availability start. The date from which onward it is possible to purchase the product from the supplier.
          example: '2025-01-01'
        availability_end:
          type:
          - string
          - 'null'
          format: date
          description: Availability end. The date until which it is possible to purchase the product from the supplier.
          example: '2025-09-09'
        manufacturer:
          type:
          - string
          - 'null'
          description: Original manufacturer of the product.
          example: Coca Cola
        standard_delivery_batch:
          type:
          - number
          - 'null'
          description: Standard delivery batch. Default batch size that is ordered or produced at a time.
          example: 5
        max_lot_size:
          type:
          - number
          - 'null'
          description: Max lot size. Maximum batch that can be ordered or produced at a time.
          example: 10
        delivery_all:
          type:
          - integer
          - 'null'
          description: The lead time from order to delivery.
          example: 3
        purchase_price:
          type:
          - number
          - 'null'
          description: Max lot size. Maximum batch that can be ordered or produced at a time.
          example: 10
        currency:
          type:
          - string
          - 'null'
          description: Currency of the purchase price of one inventory unit.
          example: EUR
        coordination_group:
          type:
          - string
          - 'null'
          description: '[PLS] Coordination group. Reference to the coordination group associated with this product-location supplier. Used for coordinated ordering with multi-supplier replenishment.'
          example: CG100001
        box_size:
          type:
          - number
          - 'null'
          description: Number of inventory units in one box. Available also on Product and Product-location level.
          example: 12
        pallet_size:
          type:
          - number
          - 'null'
          description: Number of inventory units in one pallet. Available also on Product and Product-location level.
          example: 500
        pallet_layer_size:
          type:
          - number
          - 'null'
          description: The number of inventory units of the product that fit on one pallet layer. Available also on Product and Product-location level.
          example: 1000
        space_size:
          type:
          - number
          - 'null'
          description: Space. The number of inventory units of the product that fit in one space unit.
          example: 1
        space_unit:
          type:
          - string
          - 'null'
          description: Space unit. Name for the space unit used for the product.
          example: M3
        volume:
          type:
          - number
          - 'null'
          description: Volume of one inventory unit of the product. Unit of measurement needs to be the same for all products within one coordination group / supplier. Available also on Product and Product-location level.
          example: 0.001
        volume_unit:
          type:
          - string
          - 'null'
          description: Volume unit. Name of the volume unit used for this product. Available also on Product and Product-location level.
          example: M3
        weight:
          type:
          - number
          - 'null'
          description: Gross weight of one inventory unit of the product. Weight unit is defined in the weight_unit field. Unit of measurement needs to be the same for all products within one coordination group/supplier. Available also on Product and Product-location level.
          example: 0.1
        weight_unit:
          type:
          - string
          - 'null'
          description: Name of the weight unit used for this product. Available also on Product and Product-location level.
          example: KG
