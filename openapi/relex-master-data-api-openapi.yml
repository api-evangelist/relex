          description: Location code of the component product. Needed if end_location_code given. Reference to locations.
          example: LOCATION2
        quantity:
          type: number
          description: Amount of components consumed in producing one base unit of the end product.
          example: 2
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: The first day when the bill of materials is considered in calculations.
          example: '2018-01-01'
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: The last day when the bill of materials is considered in calculations.
          example: '2018-12-31'
        active:
          type: boolean
          description: Only active records are considered in bill of materials.
          example: true
        yield_percentage:
          type:
          - number
          - 'null'
          description: Yield is the percentage of the component product that is effectively utilized for the end product after yield loss.
          example: 2
        yield_quantity:
          type:
          - number
          - 'null'
          description: Yielded quantity is the quantity of the component product that is effectively utilized for the end product after yield loss.
          example: 1
