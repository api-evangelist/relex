          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Inventory location code.
          example: LOCATION1
        supplier:
          type: string
          description: Primary supplier of the product.
          example: SUPPLIER1
        purchase_price:
          type: number
          description: Current purchase price of product (per inventory unit)
          example: 1.99
        book_value:
          type:
          - number
          - 'null'
          description: Book value of the product
          example: 1.02
        sales_price:
          type:
          - number
          - 'null'
          description: Current sales price of product (per inventory unit) excluding sales tax e.g. VAT.
          example: 7.99
        sales_tax_rate:
          type:
          - number
          - 'null'
          description: Rate of the sales tax, VAT, GST, or a similar sales-related tax.
          example: 0.24
        order_quantity:
          type:
          - number
          - 'null'
          description: Order batch size in inventory units. Available also on PL level.
          example: 12
          minimum: 0
        minimum_delivery_batch:
          type:
          - number
          - 'null'
          description: Minimum order quantity in inventory unit. If not available, there is also possibility to calculate economic order quantity in RELEX.
          example: 24
        max_lot_size:
          type:
          - number
          - 'null'
          description: Maximum lot size. Maximum batch that can be ordered or produced at a time.
          example: 10
        ugly_shelf_point:
          type:
          - number
          - 'null'
          description: Minimum number of inventory units that are required in shelf at once.
          example: 2
        shelf_space:
          type:
          - number
          - 'null'
          description: Number of inventory units that fit into shelf at once.
          example: 4
        introduction_date:
          type:
          - string
          - 'null'
          format: date
          description: Date of product introduction - product to this location is not ordered before this date. Available also on Product level.
          example: '2017-01-01'
        termination_date:
          type:
          - string
          - 'null'
          format: date
          description: Date of product termination - product to this location is not ordered after this date. Available also on Product level.
          example: '2019-12-31'
        reference_spoiling_time:
          type:
          - integer
          - 'null'
          description: Spoiling time in days. Available also on Product level.
          example: 7
        required_remaining_shelf_life:
          type:
          - integer
          - 'null'
          description: 'Required outbound delivery remaining shelf life. Forecasted spoilage in RELEX takes also batch balance''s estimated expiration date into account: effective spoiling date = "estimated_date" - "required_remaining_shelf_life". Available also on Product level.'
          example: 7
        production_lead_time:
          type:
          - integer
          - 'null'
          description: The number of days it takes for the supplier to manufacture the product so that it is shippable.
          example: 7
        box_size:
          type:
          - number
          - 'null'
          description: Number of inventory units in one box. Available also on Product level.
          example: 12
        pallet_size:
          type:
          - number
          - 'null'
          description: Number of inventory units in one pallet. Available also on Product level.
          example: 7
        inventory_unit_in_consumer_units:
          type:
          - number
          - 'null'
          description: Determines what one unit for this product-location means in consumer package units.
          example: 10
        assortment_status:
          type:
          - string
          - 'null'
          description: Determines what one unit for this product-location means in consumer package units.
          example: Live assortment
        shelving_delay:
          type:
          - integer
          - 'null'
          description: Shelving time (in days). Added at the end of lead time in order proposal calculation. This parameter overrides any shelving delay set on location level.
          example: 2
        legal_for_merchandising:
          type: boolean
          description: Used for creating the legal list for planogram optimization. A workflow task can be used to remove non-legal products.
          example: true
        illegal_for_merchandising:
          type: boolean
          description: Used for creating the illegal list for planogram optimization. A workflow task can be used to remove non-legal products.
          example: true
        reference_code:
          type:
          - string
          - 'null'
          description: Product code of the reference product.
          example: '420'
        reference_location_code:
          type:
          - string
          - 'null'
          description: Location code of the reference location.
          example: '8192'
      required:
      - product
      - location
      - supplier
      - purchase_price
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_closed_date:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: A date that is closed or open for deliveries / forecasting / ordering, depending on what selections have been made for the date in question.
          example: '2018-09-25'
        closed_for_ordering:
          type: boolean
          description: Defines if the location is closed for ordering on the defined date. If date is Closed for ordering, then order proposal calculation won't use it as a order date. Instead, the first date before it that is open for ordering will be used as the order date.
          example: true
        closed_for_forecasting:
          type: boolean
          description: Defines if the location is closed for forecasting on the defined date. No forecast will be calculated for dates that are Closed for forecasting. The weekly/monthly forecast is divided on days that are open for forecasting.
          example: true
        closed_for_deliveries:
          type: boolean
          description: Defines if the location is closed for deliveries on the defined date. If a delivery date falls on a closed date that has Closed for deliveries = Yes, then the delivery date is moved to the next date that is open for deliveries. Possible shelving delay does not decrement on dates that are closed for deliveries.
          example: false
      required:
      - location
      - date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
