    retail_batch_size:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Code for the batch-size. Can be created by concatenating the product code and the batch size, e.g. "PRODUCT1/2.0", or the description, e.g. "PRODUCT1/Box".
          example: 5789/BOX
        product:
          type: string
          minLength: 1
          description: Product code. Reference to products.
          example: '5789'
        batch_size:
          type: number
          description: Batch size quantity in product's base unit of measure
          example: 10
        price:
          type:
          - number
          - 'null'
          description: Purchase price of one inventory unit in the batch size
          example: 5
        dc_product_code:
          type:
          - string
          - 'null'
          description: Product code in DC for the specific batch size
          example: '1001'
        description:
          type:
          - string
          - 'null'
          description: Written description of the batch size.
          example: BOX.
        batch_size_label:
          type:
          - string
          - 'null'
          description: Label (ISO/ERP code) of the product batch size.
          example: PC
        length:
          type:
          - number
          - 'null'
          description: Length of this product batch size.
          example: 2
        width:
          type:
          - number
          - 'null'
          description: Width of this product batch size.
          example: 4
        height:
          type:
          - number
          - 'null'
          description: Height of this product batch size.
          example: 1
        dimension_unit:
          type:
          - string
          - 'null'
          description: Batch dimension unit. Unit in which batch size length, width, and height is defined.
          example: CM
        weight:
          type:
          - number
          - 'null'
          description: Weight of this product batch size.
          example: 1
        weight_unit:
          type:
          - string
          - 'null'
          description: Batch weight unit. Name of the weight unit used for this batch size.
          example: KG
      required:
      - code
      - product
      - batch_size
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_product:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Product code.
          example: PRODUCT1
        name:
          type: string
          description: Product name. If product name is needed in multiple localizations, it is possible to use field name_{language}, e.g. name_es for spanish or name_en for english. The full list of available localization options is in the Localization of names section.
          example: Spring shirt, unisex
        group:
          type: string
          description: Code of the sub product group in product group hierarchy. In three level hierarchy it would be code3
          example: A123
        weight:
          type: number
          description: Gross weight of one inventory unit of the product. Weight unit is defined in the "Weight unit" field. Unit of measurement needs to be the same for all products within one coordination group/supplier. Available also on Product-location level.
          example: 0.9
        weight_unit:
          type: string
          description: Name of the weight unit used for this product e.g. LBS or KG. Available also on Product-location level.
          example: KG
        ean:
          type:
          - string
          - 'null'
          description: Product's EAN code.
          example: '4740050002116'
        alternative_code:
          type:
          - string
          - 'null'
          description: Alternative code for the product. Used e.g. by central warehouse or by supplier.
          example: '4740'
        order_quantity:
          type:
          - number
          - 'null'
          description: Order batch size in inventory units. Available also on PL level..
          example: 12
          minimum: 0
        introduction_date:
          type:
          - string
          - 'null'
          format: date
          description: Date of product introduction - product is not ordered before this date. Available also on PL level.
          example: '2017-01-01'
        termination_date:
          type:
          - string
          - 'null'
          format: date
          description: Date of product termination - product is not ordered after this date. Available also on PL level.
          example: '2018-12-31'
        required_remaining_shelf_life:
          type:
          - integer
          - 'null'
          description: 'Required outbound delivery remaining shelf life. Available also on PL level. Forecasted spoilage in RELEX takes also batch balance''s estimated expiration date into account: effective spoiling date = "estimated_date" - "required_remaining_shelf_life"'
          example: 7
        reference_spoiling_time:
          type:
          - integer
          - 'null'
          description: Spoiling time in days. Available also on Product-location level.
          example: 7
        inventory_unit:
          type:
          - string
          - 'null'
          description: Name of the inventory unit
          example: PC
        height:
          type:
          - number
          - 'null'
          description: Height of one inventory unit of the product. Unit of measurement needs to be the same for all products.
          example: 25
        depth:
          type:
          - number
          - 'null'
          description: Length of one inventory unit of the product. Unit of measurement needs to be the same for all products.
          example: 0.1
        width:
          type:
          - number
          - 'null'
          description: Width of one inventory unit of the product. Unit of measurement needs to be the same for all products.
          example: 15.5
        dimension_unit:
          type:
          - string
          - 'null'
          description: Unit of measure used with Length, Width, and Height.
          example: CM
        volume_unit:
          type:
          - string
          - 'null'
          description: Name of the volume unit used for this product e.g. M3 or L. Available also on Product-location level.
          example: M3
        volume:
          type:
          - number
          - 'null'
          description: Volume of one inventory unit of the product. Volume unit is defined in the "Volume unit" field. Unit of measurement needs to be the same for all products within one coordination group/supplier
          example: 0.001
        box_size:
          type:
          - number
          - 'null'
          description: Number of inventory units in one box. Available also on PL level.
          example: 12
        pallet_size:
          type:
          - number
          - 'null'
          description: Number of inventory units in one pallet. Available also on PL level
          example: 100
        image_url:
          type:
          - string
          - 'null'
          description: URL to product related picture.
          example: http://company.com/images/PRODUCT1.png
        variant_type:
          type:
          - string
          - 'null'
          description: When shipper or prepacks are used, variant type indicates the type of the product (MASTER, VARIANT, PRE_PACK)
          example: MASTER
          enum:
          - MASTER
          - PRE_PACK
          - VARIANT
          - null
        brand:
          type:
          - string
          - 'null'
          description: Indicates the brand associated with the product.
          example: Nestle
        is_private_label:
          type: boolean
          description: Indicates whether the product is private label/store brand as opposed to national brand.
          example: true
        brand_tier:
          type:
          - string
          - 'null'
          description: Brand categories or brand groups used for Price Optimization.
          example: Nesquik
        price_family:
          type:
          - string
          - 'null'
          description: Associates the product with a price family. Used for Price Optimization.
          example: Family 1
        line_group:
          type:
          - string
          - 'null'
          description: Line groups classify related prodcuts within a retailer's catalog. Used for Price Optimization.
          example: Group 1
        is_kvi:
          type: boolean
          description: Indicates whether the item is a Key-Value-Item. Used for Price Optimization.
          example: true
        kvi_group:
          type:
          - string
          - 'null'
