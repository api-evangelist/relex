    retail_assortment:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Unique identifier for the assortment.
          example: '105040'
        name:
          type: string
          minLength: 1
          description: Name of the assortment.
          example: Breakfast Cereal Urban
        merchandising_product_group_5:
          type: string
          description: Reference to the merchandising product group hierarchy. The exact configuration needs to be discussed during implementation.
          example: '102009'
        assortment_type:
          type:
          - string
          description: 'The type and specificity of the assortment. Possible values: NONE, ENTERPRISE, CLUSTER, LOCATION.'
          example: CLUSTER
          enum:
          - CLUSTER
          - ENTERPRISE
          - LOCATION
          - NONE
        cluster_group:
          type:
          - string
          - 'null'
          description: The cluster group that the assortment belongs to.
          example: ABC
        cluster:
          type:
          - string
          - 'null'
          description: The cluster that the assortment belongs to.
          example: XYZ
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: Start date for when the assortment is effective.
          example: '2021-06-21'
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: End date for when the assortment is effective.
          example: '2021-06-22'
        min_number_of_bays:
          type:
          - integer
          - 'null'
          description: Smallest applicable number of bays where this assortment is used.
          example: 3
      required:
      - code
      - name
      - merchandising_product_group_5
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_coordination_group:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Coordination group code for Product-Locations ordered with max/min limits in CO-MRP calculation.
          example: FRESH123
        value_max:
          type:
          - number
          - 'null'
          description: Maximum amount to be ordered from supplier in location's currency in CO-MRP calculation. Purchase price needs to be defined in Product-Locations, else the product-location is not ordered.
          example: 15
        value_min:
          type:
          - number
          - 'null'
          description: Minimum amount to be ordered from supplier in location's currency in CO-MRP calculation. Purchase price needs to be defined in Product-Locations, else the product-location is not ordered.
          example: 2
        pallets_max:
          type:
          - number
          - 'null'
          description: Maximum number of pallets in CO-MRP calculation. Pallet size must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 1
        pallets_min:
          type:
          - number
          - 'null'
          description: Minimum number of pallets in CO-MRP calculation. Pallet size must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 1
        volume_max:
          type:
          - number
          - 'null'
          description: Maximum volume to be ordered in CO-MRP calculation. Volume must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 500
        volume_min:
          type:
          - number
          - 'null'
          description: Minimum volume to be ordered in CO-MRP calculation. Volume must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 30
        batches_max:
          type:
          - number
          - 'null'
          description: Maximum amount of order batches to be ordered in CO-MRP calculation. Order batch size must be defined in Product or Product-Locations, else it is considered to be 1.
          example: 22
        batches_min:
          type:
          - number
          - 'null'
          description: Minimum amount of order batches to be ordered in CO-MRP calculation. Order batch size must be defined in Product or Product-Locations, else it is considered to be 1.
          example: 12
        boxes_max:
          type:
          - number
          - 'null'
          description: Maximum amount of boxes to be ordered in CO-MRP calculation. Box size must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 5
        boxes_min:
          type:
          - number
          - 'null'
          description: Minimum amount of boxes to be ordered in CO-MRP calculation. Box size must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 1
        pallet_layers_max:
          type:
          - number
          - 'null'
          description: Maximum amount of pallet layers to be ordered in CO-MRP calculation. Pallet size must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 22
        pallet_layers_min:
          type:
          - number
          - 'null'
          description: Minimum amount of pallet layers to be ordered in CO-MRP calculation. Pallet size must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 8
        unique_products_max:
          type:
          - number
          - 'null'
          description: Maximum number of unique products-locations to be ordered in CO-MRP calculation. No special product/product-location level master data needed to enable the unique product limit.
          example: 15
        unique_products_min:
          type:
          - number
          - 'null'
          description: Minimum number of unique products-locations to be ordered in CO-MRP calculation. No special product/product-location level master data needed to enable the unique product limit.
          example: 8
        units_max:
          type:
          - number
          - 'null'
          description: Maximum number of inventory units (typically pieces) to be ordered in CO-MRP calculation. No special product/product-location level master data needed to enable the unit limit.
          example: 200
        units_min:
          type:
          - number
          - 'null'
          description: Minimum number of inventory units (typically pieces) to be ordered in CO-MRP calculation. No special product/product-location level master data needed to enable the unit limit.
          example: 100
        weight_max:
          type:
          - number
          - 'null'
          description: Maximum weight (in weight units defined for each product) to be ordered in CO-MRP calculation. Weight must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 1200
        weight_min:
          type:
          - number
          - 'null'
          description: Minimum weight (in weight units defined for each product) to be ordered in CO-MRP calculation. Weight must be defined in Product or Product-Locations, else the product-location is not ordered.
          example: 140
        bracket_price_limit_unit:
          type:
          - string
          - 'null'
          description: The limit unit for brackets attached to the coordination group.
          example: VALUE
          enum:
          - BATCHES
          - BOXES
          - PALLETS
          - PALLET_LAYERS
          - SPACE
          - UNITS
          - VALUE
          - VOLUME
          - WEIGHT
          - null
        next_bracket_start_date:
          type:
          - string
          - 'null'
          format: date
          description: Date when brackets of type Next should be used in order calculation instead of brackets with type Current.
          example: '2017-01-01'
      required:
      - code
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_product_location_batch_size:
      type: object
      properties:
        product_batch_size:
          type: string
          minLength: 1
          description: Code for the product batch-size. Can be created by concatenating the product code and the batch size, e.g. "PRODUCT1/2.0", or the description, e.g. "PRODUCT1/Box".
          example: PRODUCT1/Box
        product:
          type: string
          minLength: 1
          description: Product code. Reference to products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to locations.
          example: LOCATION1
        valid:
          type: boolean
          description: 'Validity setting: -true= product-location-batch size is valid and can be used; -false = product-location-batch size is not valid, and can not be used.'
          example: true
        validity_date_type:
          type:
          - string
          - 'null'
          minLength: 1
          description: Start and end date defined either as ORDERS or DELIVERIES.
          example: ORDERS
          enum:
          - DELIVERIES
          - ORDERS
          - null
        validity_start_date:
          type:
          - string
          - 'null'
          format: date
          description: Start of validity period for batch size. Note that the field valid needs to be set as true.
          example: '2019-01-01'
        validity_end_date:
          type:
          - string
          - 'null'
          format: date
          description: End of validity period for batch size. Note that the field valid needs to be set as true.
          example: '2019-12-31'
        batch_trigger_level:
          type:
          - number
          - 'null'
          description: Bath trigger level % for the product-location-batch size. Batch size is rounded down to nearest multiple if order need is less than trigger level % over the previous batch size multiple.
          example: 50.1
        percentage_limit:
          type:
          - number
          - 'null'
          description: ' Percentage limit % for the product-location-batch size. Batch size is used for an order (or as the 1st batch size for an order) if: order need >= percentage limit * batch size  '
          example: 0.5
        supplier_code:
          type:
          - string
          - 'null'
          description: Supplier for a product-location-batch size. Use this field to set a supplier for a product-location in a store if same product can be ordered to a store in multiple batch sizes (one batch size corresponding to one DC product), and different batch sizes are ordered from different DCs.
          example: SUPPLIER1
      required:
      - product_batch_size
      - product
      - location
      - valid
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
