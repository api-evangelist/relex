          - 'null'
          description: The number of units wide in a case pack.
          example: 3
        case_pack_units:
          type:
          - integer
          - 'null'
          description: The number of units within a case pack.
          example: 3
        nesting_height:
          type:
          - number
          - 'null'
          description: The remaining height of the product when nested vertically.
          example: 0.1
        nesting_depth:
          type:
          - number
          - 'null'
          description: The remaining depth of the product when nested vertically.
          example: 0.1
        nesting_width:
          type:
          - number
          - 'null'
          description: The remaining width of the product when nested vertically.
          example: 0.1
