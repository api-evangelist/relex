        assortment:
          type: string
          minLength: 1
          description: Unique identifier for the assortment.
          example: '105040'
        product:
          type: string
          minLength: 1
          description: Product code.
          example: '578364'
        merchandising_product_group_5:
          type: string
          minLength: 1
          description: Reference to the merchandising product group hierarchy. The exact configuration needs to be discussed during implementation.
          example: '102009'
        location:
          type: string
          minLength: 1
          description: Location code. Can be omitted if not available - in that case, a dummy location will be used in RELEX Plan.
          example: '340'
        is_ranged:
          type: boolean
          description: Is the assortment product recommended to be placed.
          example: true
        product_treatment_type:
          type:
          - string
          - 'null'
          description: 'Options: Normal, Core, Optional.'
          example: NORMAL
          enum:
          - CORE
          - NORMAL
          - OPTIONAL
          - null
        rank:
          type:
          - integer
          - 'null'
          description: Importance and priority of the assortment product.
          example: 1
        units:
          type:
          - integer
          - 'null'
          description: Number of units to place to meet inventory targets.
          example: 15
        max_units:
          type:
          - integer
          - 'null'
          description: Maximum units to place.
          example: 30
        facings:
          type:
          - integer
          - 'null'
          description: Number of facings to place.
          example: 5
        local_product:
          type: boolean
          description: Indicates whether assortment-product is a local product in this location.
          example: true
        product_localization:
          type:
          - string
          - 'null'
          description: Defines local and regional products. Possible values NONE, REGIONAL, LOCAL.
          example: REGIONAL
          enum:
          - LOCAL
          - NONE
          - REGIONAL
          - null
      required:
      - assortment
      - product
      - merchandising_product_group_5
      - location
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_campaign:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Code of the campaign.
          example: SHIRTS-2018-Q1
        name:
          type: string
          description: Name of the campaign.
          example: Shirt sale
        start_date:
          type: string
          format: date
          description: Start date of the campaign.
          example: '2018-01-01'
        end_date:
          type: string
          format: date
          description: End date of the campaign.
          example: '2018-03-31'
        campaign_class:
          type: string
          description: Distinguishes the class of the campaign. -PROMOTION = planned promotional activity -EVENT = Event affecting forecast e.g. Christmas or local concert -MARKDOWN = planned markdown campaign with reduced price -CANNIBALIZATION, HALO = Campaigns to take cannibalization and halo into account -TEMPORARY_STORE_CLOSURE = Location closed due to e.g. renovation naturally changes sales in that location to 0 -OTHER = any other class that is needed
          example: PROMOTION
          enum:
          - CANNIBALIZATION
          - EVENT
          - HALO
          - MARKDOWN
          - OTHER
          - PROMOTION
          - TEMPORARY_STORE_CLOSURE
        category:
          type:
          - string
          - 'null'
          description: Category of the campaign.  This is a non-functional field, but can be used to contain useful information about the campaign.
          example: Promotion leaflet
        campaign_group:
          type:
          - string
          - 'null'
          description: ID of promotion group if promotion belongs to a group.
          example: CG258
        campaign_group_name:
          type:
          - string
          - 'null'
          description: Promotion group name.
          example: Midsummer campaign
        minimum_purchase_quantity:
          type:
          - number
          - 'null'
          description: The minimum quantity required for the consumer to purchase to redeem the promotion.
          example: 2
        maximum_purchase_quantity:
          type:
          - number
          - 'null'
          description: The upper limit on number of purchased items for the promotion in a consumer basket.
          example: 3
        reward_quantity:
          type:
          - number
          - 'null'
          description: The reward quantity consumer gets when redeeming the promotion.
          example: 1
        multiple_quantity:
          type:
          - number
          - 'null'
          description: The number of products required to trigger the promotion each time. The same promotion can be redeemed multiple times.
          example: 3
        price_modification_method_code:
          type:
          - string
          - 'null'
          description: Price modification method corresponding to the definition of the consumer offer. Possible values:-AMT_OFF = Amount off, -PCT_OFF = Percentage off, -NEW_VALUE = New price, -NO_DISCOUNT = No discount
          example: AMT_OFF
          enum:
          - AMT_OFF
          - NEW_VALUE
          - NO_DISCOUNT
          - PCT_OFF
          - null
        price_modification_value:
          type:
          - number
          - 'null'
          description: Numeric value of the consumer offer, including tax. Depends on the price modification method code.
          example: 0.2
        state:
          type:
          - string
          - 'null'
          description: Set to DELETE to delete the campaign. Otherwise empty.
          example: DELETE
      required:
      - code
      - name
      - start_date
      - end_date
      - campaign_class
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_replenishment_agreement:
      allOf:
      - if:
          properties:
            type:
              const: SPLIT_PERCENTAGE
        then:
          required:
          - split_percentage
        else:
          required:
          - quota
      - if:
          properties:
            contract_fulfillment_period:
              const: FULL
        then:
          required:
          - start_date
          - end_date
      - if:
          properties:
            contract_fulfillment_period:
              const: RELATIVE
        then:
          required:
          - relative_contract_fulfillment_period_days_before
          - relative_contract_fulfillment_period_days_after
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Replenishment agreement code.
          example: '529173'
        name:
          type: string
          description: Replenishment agreement name.
          example: March 2021 purchase contract with vendor A
        type:
          type: string
          description: Determines the type of the replenishment agreement.
          example: MIN_QUOTA
          enum:
          - MAX_QUOTA
          - MIN_QUOTA
          - SPLIT_PERCENTAGE
        quota:
          type:
          - number
          - 'null'
          description: Defines the minimum or maximum quota to be sourced from the supplier this replenishment agreement is connected to. Mandatory if the type field (see above) is set to MIN_QUOTA or MAX_QUOTA. The replenishment agreement type also defines how the value in this field is to be interpreted. If the type field is set to MIN_QUOTA, the value in this field is interpreted as a minimum quota whereas for MAX_QUOTA, the value is interpreted as a maximum quota.
          example: 200
          minimum: 0
        split_percentage:
          type:
          - number
          - 'null'
          description: Defines the share of orders or deliveries to be sourced from the supplier the replenishment agreement is connected to. Mandatory with type = SPLIT_PERCENTAGE. The percentage should be given as a decimal, i.e. 50 % should be given as 0.50.
          example: 0.5
          minimum: 0
        split_percentage_or_quota_unit:
          type:
          - string
          - 'null'
          description: Defines the unit for the split percentage or quota. For example, type = MIN_QUOTA, quota = 100, and split_percentage_or_quota_unit = PALLETS mean that at least 100 pallets must be sourced from the supplier in question.
          example: BATCHES
          enum:
          - BATCHES
          - BOXES
          - PALLETS
          - PALLET_LAYERS
          - QUANTITY
          - SPACE
          - VALUE
          - VOLUME
          - WEIGHT
          - null
        active:
          type: boolean
          description: Determines whether the replenishment agreement is to be considered in calculations. Can be set to false to temporarily deactivate the replenishment agreement.
          example: true
        contract_fulfillment_period:
          type:
          - string
          - 'null'
          description: Defines the so-called contract fulfillment period associated with the replenishment agreement.
          example: INDIVIDUAL
          enum:
          - DAILY
          - FULL
          - INDIVIDUAL
          - MONTHLY
          - RELATIVE
          - WEEKLY
          - YEARLY
          - null
        contract_fulfillment_period_considered_for:
          type:
          - string
          - 'null'
          description: Determines whether the contract fulfillment period for a quota or split percentage is to be considered for orders or deliveries.
          example: ORDERS
          enum:
          - DELIVERIES
          - ORDERS
          - null
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: Stores the first date on which the replenishment agreement is to be considered. Mandatory with contract_fulfillment_period = FULL, but optional otherwise.
          example: '2017-01-01'
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: Stores the last date on which the replenishment agreement is to be considered. Mandatory with contract_fulfillment_period = FULL, but optional otherwise.
          example: '2017-12-01'
        relative_contract_fulfillment_period_days_before:
          type:
          - integer
          - 'null'
          description: Defines how many days preceding the order or delivery date are to be considered for a relative contract fulfillment period. A negative value is converted into a positive one in order proposal calculation. Only considered with and mandatory for contract_fulfillment_period = RELATIVE.
          example: 15
        relative_contract_fulfillment_period_days_after:
          type:
          - integer
          - 'null'
          description: Defines how many days following the order or delivery date are to be considered for a relative contract fulfillment period. Only considered with and mandatory for contract_fulfillment_period = RELATIVE.
          example: 1
      required:
      - code
      - name
      - type
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
