    retail_product_location_supplier_replenishment_agreement:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        supplier:
          type: string
          minLength: 1
          description: Supplier code. Reference to Suppliers.
          example: SUPPLIER1
        replenishment_agreement:
          type: string
          minLength: 1
          description: Unique identifier for the replenishment agreement.
          example: '529173'
        active:
          type: boolean
          description: Determines whether this product-location-supplier replenishment agreement is considered in calculations. Can be set to false to temporarily deactivate the product-location-supplier replenishment agreement. Both this and the same field on replenishment agreement level need to be true in order for the product-location-supplier replenishment agreement to be active.
          example: true
        quota:
          type:
          - number
          - 'null'
          description: Defines the minimum or maximum quota to be sourced from the supplier this product location supplier replenishment agreement is connected to. Only considered if the type of replenishment agreement is set to "Min. quota" or "Max. quota". The replenishment agreement type also defines how the value in this field is to be interpreted. If the type is set to "Min. quota", the value in this field is interpreted as a minimum quota whereas for "Max. quota", the value is interpreted as a maximum quota. This field takes precedence over the same field on replenishment agreement level.
          example: 200
        split_percentage:
          type:
          - number
          - 'null'
          description: Defines the share of orders or deliveries to be sourced from the supplier this product location supplier replenishment agreement is connected to. Only considered if the type of this replenishment agreement is set to "Split percentage". This field takes precedence over the same field on replenishment agreement level.
          example: 0.5
      required:
      - product
      - location
      - supplier
      - replenishment_agreement
