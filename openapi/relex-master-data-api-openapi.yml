          - string
          - 'null'
          description: Indicates the manufacturer of the product.
          example: Nestle
        merchandising_style:
          type:
          - string
          - 'null'
          description: 'Indicates how the product is merchandised in a planogram by default. Possible values: UNIT, TRAY, CASE, ALTERNATE, DISPLAY, POINT OF PURCHASE'
          example: TRAY
          enum:
          - ALTERNATE
          - CASE
          - DISPLAY
          - POINT OF PURCHASE
          - TRAY
          - UNIT
          - null
        case_height:
          type:
          - number
          - 'null'
          description: The height of the merchandised case.
          example: 0.1
        case_depth:
          type:
          - number
          - 'null'
          description: The depth of the merchandised case.
          example: 0.1
        case_width:
          type:
          - number
          - 'null'
          description: The width of the merchandised case.
