          type: string
          minLength: 1
          description: Product code.
          example: '58974'
        ean_batch_size_label:
          type:
          - string
          - 'null'
          description: The batch size of the EAN code to distinguish between consumer unit EAN and sales batch size EAN.
          example: '10101001'
        primary_ean:
          type: boolean
          description: Indicator to distinguish the primary EAN code of the product.
          example: true
