    retail_closed_date:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        date:
          type: string
          minLength: 1
          format: date
          description: A date that is closed or open for deliveries / forecasting / ordering, depending on what selections have been made for the date in question.
          example: '2018-09-25'
        closed_for_ordering:
          type: boolean
          description: Defines if the location is closed for ordering on the defined date. If date is Closed for ordering, then order proposal calculation won't use it as a order date. Instead, the first date before it that is open for ordering will be used as the order date.
          example: true
        closed_for_forecasting:
          type: boolean
          description: Defines if the location is closed for forecasting on the defined date. No forecast will be calculated for dates that are Closed for forecasting. The weekly/monthly forecast is divided on days that are open for forecasting.
          example: true
        closed_for_deliveries:
          type: boolean
          description: Defines if the location is closed for deliveries on the defined date. If a delivery date falls on a closed date that has Closed for deliveries = Yes, then the delivery date is moved to the next date that is open for deliveries. Possible shelving delay does not decrement on dates that are closed for deliveries.
          example: false
      required:
      - location
      - date
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_replenishment_agreement:
      allOf:
      - if:
          properties:
            type:
              const: SPLIT_PERCENTAGE
        then:
          required:
          - split_percentage
        else:
          required:
          - quota
      - if:
          properties:
            contract_fulfillment_period:
              const: FULL
        then:
          required:
          - start_date
          - end_date
      - if:
          properties:
            contract_fulfillment_period:
              const: RELATIVE
        then:
          required:
          - relative_contract_fulfillment_period_days_before
          - relative_contract_fulfillment_period_days_after
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Replenishment agreement code.
          example: '529173'
        name:
          type: string
          description: Replenishment agreement name.
          example: March 2021 purchase contract with vendor A
        type:
          type: string
          description: Determines the type of the replenishment agreement.
          example: MIN_QUOTA
          enum:
          - MAX_QUOTA
          - MIN_QUOTA
          - SPLIT_PERCENTAGE
        quota:
          type:
          - number
          - 'null'
          description: Defines the minimum or maximum quota to be sourced from the supplier this replenishment agreement is connected to. Mandatory if the type field (see above) is set to MIN_QUOTA or MAX_QUOTA. The replenishment agreement type also defines how the value in this field is to be interpreted. If the type field is set to MIN_QUOTA, the value in this field is interpreted as a minimum quota whereas for MAX_QUOTA, the value is interpreted as a maximum quota.
          example: 200
          minimum: 0
        split_percentage:
          type:
          - number
          - 'null'
          description: Defines the share of orders or deliveries to be sourced from the supplier the replenishment agreement is connected to. Mandatory with type = SPLIT_PERCENTAGE. The percentage should be given as a decimal, i.e. 50 % should be given as 0.50.
          example: 0.5
          minimum: 0
        split_percentage_or_quota_unit:
          type:
          - string
          - 'null'
          description: Defines the unit for the split percentage or quota. For example, type = MIN_QUOTA, quota = 100, and split_percentage_or_quota_unit = PALLETS mean that at least 100 pallets must be sourced from the supplier in question.
          example: BATCHES
          enum:
          - BATCHES
          - BOXES
          - PALLETS
          - PALLET_LAYERS
          - QUANTITY
          - SPACE
          - VALUE
          - VOLUME
          - WEIGHT
          - null
        active:
          type: boolean
          description: Determines whether the replenishment agreement is to be considered in calculations. Can be set to false to temporarily deactivate the replenishment agreement.
          example: true
        contract_fulfillment_period:
          type:
          - string
          - 'null'
          description: Defines the so-called contract fulfillment period associated with the replenishment agreement.
          example: INDIVIDUAL
          enum:
          - DAILY
          - FULL
          - INDIVIDUAL
          - MONTHLY
          - RELATIVE
          - WEEKLY
          - YEARLY
          - null
        contract_fulfillment_period_considered_for:
          type:
          - string
          - 'null'
          description: Determines whether the contract fulfillment period for a quota or split percentage is to be considered for orders or deliveries.
          example: ORDERS
          enum:
          - DELIVERIES
          - ORDERS
          - null
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: Stores the first date on which the replenishment agreement is to be considered. Mandatory with contract_fulfillment_period = FULL, but optional otherwise.
          example: '2017-01-01'
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: Stores the last date on which the replenishment agreement is to be considered. Mandatory with contract_fulfillment_period = FULL, but optional otherwise.
          example: '2017-12-01'
        relative_contract_fulfillment_period_days_before:
          type:
          - integer
          - 'null'
          description: Defines how many days preceding the order or delivery date are to be considered for a relative contract fulfillment period. A negative value is converted into a positive one in order proposal calculation. Only considered with and mandatory for contract_fulfillment_period = RELATIVE.
          example: 15
        relative_contract_fulfillment_period_days_after:
          type:
          - integer
          - 'null'
          description: Defines how many days following the order or delivery date are to be considered for a relative contract fulfillment period. Only considered with and mandatory for contract_fulfillment_period = RELATIVE.
          example: 1
      required:
      - code
      - name
      - type
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
