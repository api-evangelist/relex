    retail_campaign:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Code of the campaign.
          example: SHIRTS-2018-Q1
        name:
          type: string
          description: Name of the campaign.
          example: Shirt sale
        start_date:
          type: string
          format: date
          description: Start date of the campaign.
          example: '2018-01-01'
        end_date:
          type: string
          format: date
          description: End date of the campaign.
          example: '2018-03-31'
        campaign_class:
          type: string
          description: Distinguishes the class of the campaign. -PROMOTION = planned promotional activity -EVENT = Event affecting forecast e.g. Christmas or local concert -MARKDOWN = planned markdown campaign with reduced price -CANNIBALIZATION, HALO = Campaigns to take cannibalization and halo into account -TEMPORARY_STORE_CLOSURE = Location closed due to e.g. renovation naturally changes sales in that location to 0 -OTHER = any other class that is needed
          example: PROMOTION
          enum:
          - CANNIBALIZATION
          - EVENT
          - HALO
          - MARKDOWN
          - OTHER
          - PROMOTION
          - TEMPORARY_STORE_CLOSURE
        category:
          type:
          - string
          - 'null'
          description: Category of the campaign.  This is a non-functional field, but can be used to contain useful information about the campaign.
          example: Promotion leaflet
        campaign_group:
          type:
          - string
          - 'null'
          description: ID of promotion group if promotion belongs to a group.
          example: CG258
        campaign_group_name:
          type:
          - string
          - 'null'
          description: Promotion group name.
          example: Midsummer campaign
        minimum_purchase_quantity:
          type:
          - number
          - 'null'
          description: The minimum quantity required for the consumer to purchase to redeem the promotion.
          example: 2
        maximum_purchase_quantity:
          type:
          - number
          - 'null'
          description: The upper limit on number of purchased items for the promotion in a consumer basket.
          example: 3
        reward_quantity:
          type:
          - number
          - 'null'
          description: The reward quantity consumer gets when redeeming the promotion.
          example: 1
        multiple_quantity:
          type:
          - number
          - 'null'
          description: The number of products required to trigger the promotion each time. The same promotion can be redeemed multiple times.
          example: 3
        price_modification_method_code:
          type:
          - string
          - 'null'
          description: Price modification method corresponding to the definition of the consumer offer. Possible values:-AMT_OFF = Amount off, -PCT_OFF = Percentage off, -NEW_VALUE = New price, -NO_DISCOUNT = No discount
          example: AMT_OFF
          enum:
          - AMT_OFF
          - NEW_VALUE
          - NO_DISCOUNT
          - PCT_OFF
          - null
        price_modification_value:
          type:
          - number
          - 'null'
          description: Numeric value of the consumer offer, including tax. Depends on the price modification method code.
          example: 0.2
        state:
          type:
          - string
          - 'null'
          description: Set to DELETE to delete the campaign. Otherwise empty.
          example: DELETE
      required:
      - code
      - name
      - start_date
      - end_date
      - campaign_class
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
