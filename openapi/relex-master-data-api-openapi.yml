        price_calendar:
          type: string
          minLength: 1
          description: Unique identifier of the price calendar.
          example: '100100100'
        product:
          type: string
          minLength: 1
          description: Item code.
          example: PRODUCT1
        location:
          type: string
          minLength: 1
          description: Inventory Location code.
          example: LOCATION1
      required:
      - price_calendar
      - product
      - location
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    inbound_meta:
      type: object
      properties:
        timestamp:
          type: integer
          description: Timestamp used to order messages. For example UNIX timestamp in UTC. If there are multiple senders timestamps they generate should be synchronized
          example: 1624437035
        batch_id:
          type: string
          description: A UUID that uniquely identifies this particular request.
          example: 1692c610-6d26-11eb-9439-0242ac130002
          format: uuid
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_product_location_coordination_group_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_product_location_coordination_group'
    retail_supplier_location_closure:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        supplier:
          type: string
          minLength: 1
          description: Supplier code. Reference to Suppliers.
          example: SUPPLIER1
        date:
          type: string
          minLength: 1
          format: date
          description: Supplier closed date. Each supplier closed date needs to have a row and it is not possible to define this by a range.
          example: '2024-09-23'
        closed:
          type: boolean
          description: Defines if supplier is open or closed.
          example: true
      required:
      - location
      - supplier
      - date
      - closed
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_delete_location_supplier_delivery_schedule:
