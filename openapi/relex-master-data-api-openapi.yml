          example: '5500'
        name:
          type: string
          description: Location name.
          example: Helsinki
          minLength: 1
        location_type:
          type:
          - string
          - 'null'
          description: 'Defines the location''s role in the supply chain: DC (distribution center), store or other'
          example: DC
          enum:
          - ''
          - CUSTOMER
          - CUSTOMER_GROUP
          - DC
          - E_COMMERCE
          - MANUFACTURING
          - OTHER
          - PLANNING_LEVEL
          - REGIONAL_DC
          - STORE
          - null
        chain:
          type:
          - string
          - 'null'
          description: Chain code of the chain the location belongs to. Reference to Chains.
          example: CHAIN1
        country:
          type:
          - string
          - 'null'
          description: Two-letter country code of the location. Can also be set in its own interface (linked to chains).
          example: FI
        country_name:
          type:
          - string
          - 'null'
          description: Name of the country of the location used for Promotion Planing. Can also be set in its own interface (linked to chains).
          example: Finland
        longitude:
          type:
          - number
          - 'null'
          description: Longitude (in degrees) of the store. Mandatory for weather-based forecasting and map visualizations.
          example: 24.938379
        latitude:
          type:
          - number
          - 'null'
          description: Latitude (in degrees) of the store. Mandatory for weather-based forecasting and map visualizations.
          example: 60.169857
        city:
          type:
          - string
          - 'null'
          description: The city of the location.
          example: Albany
        currency:
          description: Currency that the location uses.
          $ref: '#/components/schemas/currency'
        buying_forbidden:
          type: boolean
          description: Sets the specific locations to purchase prohibition. true = Buying of products in this location has been forbidden, i.e. products in this location will not be ordered; false = Buying of products in this location is allowed
          example: false
        state_name:
          type:
          - string
          - 'null'
          description: To link the location to a specific state. This allows different business rules, aggregate views and metrics to be used more easily.
          example: New York
        region:
          type:
          - string
          - 'null'
          description: The region of the location.
          example: North East
        location_opening_date:
          type:
          - string
          - 'null'
          format: date
          description: Initial opening date of the location.
          example: '2022-01-01'
        location_closing_date:
          type:
          - string
          - 'null'
          format: date
          description: final closing date of the location.
          example: '2022-01-02'
        reference_code:
          type:
          - string
          - 'null'
          description: Code of the location used as reference (old) location for new location in sales forecasting..
          example: '5591'
        number_of_checkouts:
          type:
          - number
          - 'null'
          description: Number of checkouts in the location.
          example: 8
        store_net_sales_area:
          type:
          - number
          - 'null'
          description: The size of the sales floor area in the location (in square metres or square feet).
          example: 1500
        store_size:
          type:
          - number
          - 'null'
          description: The total size of the floor area in the location (in square metres or square feet).
          example: 1700
        timezone:
          type:
          - string
          - 'null'
          description: Timezone of this location as defined in tz database's TZ identifier..
          example: Europe/Helsinki
        postal_code:
          type:
          - string
          - 'null'
          description: Postal code or ZIP code belonging to the location.
          example: '27301'
        block_start_date:
          type:
          - string
          - 'null'
          format: date
          description: First date of location's block, e.g. store renovation.
          example: '2024-12-01'
        block_end_date:
          type:
          - string
          - 'null'
          format: date
          description: Last date of location's block, e.g. store renovation.
