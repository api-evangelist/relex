components:
  schemas:
    retail_product_location_batch_size_request_body:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        meta:
          type: object
          $ref: '#/components/schemas/inbound_meta'
        data:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/retail_product_location_batch_size'
    currency:
      type:
      - string
      - 'null'
      description: The currency of the value, if the currency can differ from row to row. The preferred method for sending values is to always use standard home currency of the company or the location (in case there are multiple currencies in use).
      example: USD
      enum:
      - AUD
      - BGN
      - BRL
      - CAD
      - CHF
      - CNY
      - CZK
      - DKK
      - EUR
      - GBP
      - HKD
      - HRK
      - HUF
      - IDR
      - ILS
      - INR
      - ISK
      - JPY
      - KRW
      - MXN
      - MYR
      - NOK
      - NZD
      - PHP
      - PLN
      - RON
      - RUB
      - SEK
      - SGD
      - THB
      - TRY
      - USD
      - ZAR
      - null
    retail_product_location_coordination_group:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Item code
          example: ITEM1
        location:
          type: string
          minLength: 1
          description: Inventory location code
          example: LOCATION1
        coordination_group:
          type: string
          minLength: 1
          description: Coordination Group send in the Coordination Group interface.
          example: FRESH123
      required:
      - product
      - location
      - coordination_group
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_location_category_cluster_group_cluster:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: LOCATION1
        merchandising_product_group_5:
          type: string
          minLength: 1
          description: Reference to the merchandising product group hierarchy. The exact configuration needs to be discussed during implementation.
          example: '102009'
        cluster_group:
          type: string
          minLength: 1
          description: Cluster group code.
          example: BREAKFAST CEREAL 2021
        cluster:
          type: string
          minLength: 1
          description: Cluster code.
          example: URBAN
      required:
      - location
      - merchandising_product_group_5
      - cluster_group
      - cluster
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
