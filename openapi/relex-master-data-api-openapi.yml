    retail_product_location_supplier:
      type: object
      properties:
        product:
          type: string
          minLength: 1
          description: Product code. Reference to Products.
          example: '5789'
        location:
          type: string
          minLength: 1
          description: Location code. Reference to Locations.
          example: DC001
        supplier:
          type: string
          minLength: 1
          description: Supplier code. Reference to Suppliers.
          example: S1400
        batch_size:
          type:
          - number
          - 'null'
          description: Batch size for supplier of product-location.
          example: 10
        preferred:
          type: boolean
          description: Set to true if it's the preferred supplier.
          example: true
        minimum_delivery_batch:
          type:
          - number
          - 'null'
          description: Number of inventory units that must be ordered at minimum.
          example: 150
        erp_reference:
          type:
          - string
          - 'null'
          description: ERP document reference.
          example: '20004567'
        purchase_batch_unit:
          type:
          - string
          - 'null'
          description: Purchase batch unit. Inventory unit of the purchase batch size.
          example: BOX
        supplier_subcategory:
          type:
          - string
          - 'null'
          description: Supplier subcategory. Additional subcategory for supplier.
          example: Cold cuts
        alternative_product_code:
          type:
          - string
          - 'null'
          description: Alternative product code. Supplier's product code
          example: P1111
        availability_start:
          type:
          - string
          - 'null'
          format: date
          description: Availability start. The date from which onward it is possible to purchase the product from the supplier.
          example: '2025-01-01'
        availability_end:
          type:
          - string
          - 'null'
          format: date
          description: Availability end. The date until which it is possible to purchase the product from the supplier.
          example: '2025-09-09'
        manufacturer:
          type:
          - string
          - 'null'
          description: Original manufacturer of the product.
          example: Coca Cola
        standard_delivery_batch:
          type:
          - number
          - 'null'
          description: Standard delivery batch. Default batch size that is ordered or produced at a time.
          example: 5
        max_lot_size:
          type:
          - number
          - 'null'
          description: Max lot size. Maximum batch that can be ordered or produced at a time.
          example: 10
        delivery_all:
          type:
          - integer
          - 'null'
          description: The lead time from order to delivery.
          example: 3
        purchase_price:
          type:
          - number
          - 'null'
          description: Max lot size. Maximum batch that can be ordered or produced at a time.
          example: 10
        currency:
          type:
          - string
          - 'null'
