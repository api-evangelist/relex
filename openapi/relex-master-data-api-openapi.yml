    retail_delivery_schedule:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Delivery schedule code. Delivery schedules can be used to define order and delivery days that are considered only on a certain time period.
          example: 2017-01-01-2019-01-01_ABCDE
        name:
          type: string
          minLength: 1
          description: Delivery schedule name.
          example: Schedule ABCDE
        start_date:
          type:
          - string
          - 'null'
          format: date
          description: Defines the date when the delivery schedule is first considered. Start date is the first order date or first delivery date depending on what is selected in the parameter Start and end date defined as.
          example: '2017-01-01'
        end_date:
          type:
          - string
          - 'null'
          format: date
          description: Defines the last date when the delivery schedule is considered. End date is the last order date or last delivery date depending on what is selected in the parameter Start and end date defined as.
          example: '2019-01-01'
        delivery_schedule:
          type: string
          description: Order cycle, if less frequent than every week. Defined by order day, e.g. selection 'Odd weeks' means order proposals on odd week numbers only.
          example: EVEN_WEEKS
          enum:
          - EVEN_WEEKS
          - EVERY_WEEK
          - FIRST_FULL_WEEK_OF_EVEN_MONTHS
          - FIRST_FULL_WEEK_OF_MONTH
          - FIRST_FULL_WEEK_OF_MONTHS_1_4_7
          - FIRST_FULL_WEEK_OF_MONTHS_2_5_8
          - FIRST_FULL_WEEK_OF_MONTHS_3_6_9
          - FIRST_FULL_WEEK_OF_ODD_MONTHS
          - LAST_FULL_WEEK_OF_MONTH
          - NOT_WEEKS_1_5_9
          - NOT_WEEKS_2_6_10
          - NOT_WEEKS_3_7_11
          - NOT_WEEKS_4_8_12
          - ODD_WEEKS
          - SECOND_FULL_WEEK_OF_MONTH
          - THIRD_FULL_WEEK_OF_MONTH
          - WEEKS_1_4_7
          - WEEKS_1_5_9
          - WEEKS_2_5_8
          - WEEKS_2_6_10
          - WEEKS_3_6_9
          - WEEKS_3_7_11
          - WEEKS_4_8_12
        delivery_time:
          type: string
          description: Determines whether lead time is calculated in calendar days (7-days week), weekdays (5-days week), or open days.
          example: OPEN_DAYS
          enum:
          - FIVE_DAYS_WEEK
          - OPEN_DAYS
          - SEVEN_DAYS_WEEK
        start_and_end_date_type:
          type:
          - string
          - 'null'
          description: Determines whether Start date and End date are considered as order days or delivery days
          example: ORDERS
          enum:
          - DELIVERIES
          - ORDERS
          - null
        order_0:
          type: boolean
          description: Order on Mondays.
          example: true
        order_1:
          type: boolean
          description: Order on Tuesdays.
          example: false
        order_2:
          type: boolean
          description: Order on Wednesdays.
          example: false
        order_3:
          type: boolean
          description: Order on Thursdays.
          example: false
        order_4:
          type: boolean
          description: Order on Fridays.
          example: false
        order_5:
          type: boolean
          description: Order on Saturdays.
          example: false
        order_6:
          type: boolean
          description: Order on Sundays.
          example: false
        delivery_all:
          type:
          - integer
          - 'null'
          description: Delivery lead time for all days.
          example: 7
        delivery_0:
          type:
          - integer
          - 'null'
          description: The lead time of the deliver on Monday. If there's no delivery on Monday, leave empty.
          example: 4
        delivery_1:
          type:
          - integer
          - 'null'
          description: The lead time of the deliver on Tuesday. If there's no delivery on Tuesday, leave empty.
          example: 3
        delivery_2:
          type:
          - integer
          - 'null'
          description: The lead time of the deliver on Wednesday. If there's no delivery on Wednesday, leave empty.
          example: 7
        delivery_3:
          type:
          - integer
          - 'null'
          description: The lead time of the deliver on Thursday. If there's no delivery on Thursday, leave empty.
          example: 5
        delivery_4:
          type:
          - integer
          - 'null'
          description: The lead time of the deliver on Friday. If there's no delivery on Friday, leave empty.
          example: 2
        delivery_5:
          type:
          - integer
          - 'null'
          description: The lead time of the deliver on Saturday. If there's no delivery on Saturday, leave empty.
          example: 2
        delivery_6:
          type:
          - integer
          - 'null'
          description: The lead time of the deliver on Sunday. If there's no delivery on Sunday, leave empty.
          example: 2
        main_delivery_date_0:
          type: boolean
          description: Defines whether Monday is a main delivery date. If at least one weekday is set as a main delivery date, other delivery days are considered secondary.
          example: true
        main_delivery_date_1:
          type: boolean
          description: Defines whether Tuesday is a main delivery date. If at least one weekday is set as a main delivery date, other delivery days are considered secondary.
          example: false
        main_delivery_date_2:
          type: boolean
          description: Defines whether Wednesday is a main delivery date. If at least one weekday is set as a main delivery date, other delivery days are considered secondary.
          example: false
        main_delivery_date_3:
          type: boolean
          description: Defines whether Thursday is a main delivery date. If at least one weekday is set as a main delivery date, other delivery days are considered secondary.
          example: false
        main_delivery_date_4:
          type: boolean
          description: Defines whether Friday is a main delivery date. If at least one weekday is set as a main delivery date, other delivery days are considered secondary.
          example: false
        main_delivery_date_5:
          type: boolean
          description: Defines whether Saturday is a main delivery date. If at least one weekday is set as a main delivery date, other delivery days are considered secondary.
          example: false
        main_delivery_date_6:
          type: boolean
          description: Defines whether Sunday is a main delivery date. If at least one weekday is set as a main delivery date, other delivery days are considered secondary.
          example: false
      required:
      - code
      - name
      - delivery_schedule
      - delivery_time
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_product_location:
      type: object
