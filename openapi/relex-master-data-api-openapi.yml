    retail_constraint_group:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Constraint group code.
          example: GROUP_1
        active:
          type: boolean
          description: Only active constraint groups are considered in calculations.
          example: true
        name:
          type: string
          description: Name of the constraint group
          example: SUPPLY_LIMIT_1
        constraint_date_type:
          type: string
          minLength: 1
          description: Defines if constraint is on order or delivery date.
          example: ORDER_DATE
          enum:
          - DELIVERY_DATE
          - ORDER_DATE
        level:
          type: string
          minLength: 1
          description: Level describes source of constraint and can be used to build hierarchies together with priority field
          example: SUPPLY
          enum:
          - OTHER
          - PICKING
          - SUPPLY
        multiple_constraints:
          type: boolean
          description: Allows or disallows the ordering of multiple maximum constraints in the constrained replenishment calculation.
          example: true
        multiples_max:
          type:
          - number
          - 'null'
          description: Determines the maximum number of times the constraints can be extended. It only applies if multiple constraints are enabled. An empty value means that there are no limitations.
          example: 3
        trigger_level:
          type:
          - number
          - 'null'
          description: Defines trigger level for constraints.
          example: 0.25
        priority:
          type:
          - number
          - 'null'
          description: Priority controls execution order of constraint groups. Higher priority is strict relative to lower priority.
          example: 100
        use_dynamic_limits:
          type: boolean
          description: Use dynamic limits determines whether dynamic constraints are calculated and considered
          example: true
        product:
          type: string
          description: The product that supplies the constraint group. Used in dynamic constraint calculation.
          example: PROD1
        supplier:
          type: string
          description: The supplier of the constraint group. Used in dynamic constraint calculation and in determining active constraints for product-locations.
          example: SUPP1
        unit:
          type: string
          minLength: 1
          description: Unit for constraint group.
          example: PALLET_LAYERS
          enum:
          - BATCHES
          - BOXES
          - PALLETS
          - PALLET_LAYERS
          - SPACE
          - UNITS
          - VALUE
          - VOLUME
          - WEIGHT
      required:
      - code
      $schema: https://json-schema.org/draft/2020-12/schema
      additionalProperties: false
    retail_coordination_group_bracket:
      type: object
