note: >-
  Limits are published in the "Quotas and limits" section of the RELEX Data API reference and are
  explicitly described by RELEX as negotiable — "subject to discussion" for the rate, and
  "determined during the implementation project" for the values as a whole. RELEX states it imposes
  NO limit on response payload size. The RELEX Monitoring API reference publishes no limits at all.
  No RateLimit-* or X-RateLimit-* response headers are documented or declared in either OpenAPI, so
  an agent has no runtime budget signal — it can only react to the 429/413 status codes after the
  fact.
limit_count: 2
limits:
- api: RELEX Data API
  scope: per-client (OAuth client credentials identity), all endpoints
  window: 1 second
  limit: 5
  unit: requests
  burst: null
  negotiable: true
  status_on_exhaustion: 429
  source: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
- api: RELEX Data API
  scope: per-request payload size, all POST endpoints
  window: per request
  limit: 1
  unit: megabytes
  negotiable: true
  status_on_exhaustion: 413
  note: >-
    Payloads over 1 MB must be split into smaller chunks and sent as multiple independent requests;
    each chunk is processed separately.
  source: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
response_headers:
