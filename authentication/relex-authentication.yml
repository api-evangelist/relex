model: >-
  One model across both APIs — OAuth 2.0 Client Credentials against RELEX Identity, an OpenID
  Connect provider, returning a JWT bearer token. There is no API-key path, no basic auth and no
  mTLS. Credentials are provisioned by RELEX; there is no signup, console or developer registration
  that issues them.
