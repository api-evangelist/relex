  token_type: Bearer
token_use:
  header: Authorization
  format: 'Bearer <jwt>'
  jwt: true
  jwt_rfc: RFC 7519
  jwks_uri: https://identity.prod-eu.prod.cc.relexsolutions.com/login/restapi_prod/.well-known/openid-configuration/jwks
expiry:
  refresh_tokens: false
  refresh_note: >-
    RELEX cites RFC 6749 §4.4.3 directly — the Client Credentials grant is not compatible with
    refresh tokens. On expiry the API returns 401.
  client_strategies:
  - React to 401 by re-running the Client Credentials grant.
  - Track expires_in and pre-emptively re-issue before it elapses.
credential_issuance:
