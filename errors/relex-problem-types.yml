generated: '2026-08-26'
method: searched
source: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
derived_from:
- openapi/relex-data-api-openapi.json
- openapi/relex-monitoring-api-openapi.json
format: rfc7807
media_type: application/problem+json
note: >-
  RELEX declares RFC 7807 Problem Details explicitly, both in prose ("To convey details about
  errors to clients in JSON responses, the RELEX Data API uses the RFC 7807 standard") and in the
  contract: components.schemas.problem_details_general is a real Problem Details object with
  type/title/status required, and every one of the 83 Data API paths wires 400/401/403/404/413/429
  and a 5XX wildcard to shared $ref responses carrying application/problem+json with worked
  examples. RFC 9457 obsoletes 7807 but the wire format is unchanged. There is no numeric,
  vendor-specific error-code registry — RELEX identifies problems by the type URI and by HTTP
  status alone.
envelope:
  members:
  - name: type
    required: true
    format: uri
    description: A URI reference identifying the problem type.
    observed_pattern: https://relexsolutions.com/rest/errors/{status}
  - name: title
    required: true
    description: Short human-readable summary of the problem type.
  - name: status
    required: true
    type: number
    description: The HTTP status code generated by the origin server.
  - name: detail
    required: false
    description: Human-readable explanation specific to this occurrence.
  - name: instance
    required: false
  extensible: true
problem_types:
- status: 400
  title: Bad Request
  type: https://relexsolutions.com/rest/errors/400
  meaning: The request was unacceptable — for example a missing parameter, a malformed payload, or
    a call made over plain HTTP instead of HTTPS.
  remediation: Validate the payload against the resource schema before resending; confirm the
    request used HTTPS.
  schema: problem_details_400
  source: openapi/relex-data-api-openapi.json
- status: 401
  title: Unauthorized
  type: https://relexsolutions.com/rest/errors/401
  meaning: The bearer token is missing, invalid, expired or revoked.
  remediation: Re-run the OAuth 2.0 client-credentials grant against the RELEX Identity token
    endpoint and retry with the new access token. Client Credentials issues no refresh token.
  source: openapi/relex-data-api-openapi.json
- status: 403
  title: Forbidden
  type: https://relexsolutions.com/rest/errors/403
  meaning: The client is authenticated but forbidden — commonly a connectivity restriction such as
    the caller's IP not being on the configured allowlist.
  remediation: Check that the calling egress IP is on the RELEX IP allowlist for the environment.
  source: openapi/relex-data-api-openapi.json
- status: 404
  title: Page Not Found
  type: https://relexsolutions.com/rest/errors/404
  meaning: Resource was not found — most often a mistyped resource name or a custom resource that
    is not provisioned for this customer's data model.
  remediation: Confirm the resource exists in this customer's data model version; custom resources
    differ per customer.
  source: openapi/relex-data-api-openapi.json
- status: 413
  title: Content Too Large
  type: https://relexsolutions.com/rest/errors/413
  meaning: Request payload exceeded the 1 MB maximum.
  remediation: Split the record list into smaller chunks and send them as independent requests.
    Each chunk is processed separately.
  example:
    type: https://example.com/probs/size-limit-exceeded
    title: Payload Too Large
    status: 413
    detail: Payload was larger than 1mb
  source: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
- status: 429
  title: Too Many Requests
  type: https://relexsolutions.com/rest/errors/429
  meaning: The 5 requests-per-second rate limit was exceeded.
  remediation: 'Back off and retry. No Retry-After header is returned and no backoff schedule is
    published, so the client must choose its own; the docs say only "Please retry later".'
  example:
    type: https://relexsolutions.com/rest/errors/429
    title: Too Many Requests
    status: 429
    detail: 'Rate limit has been exceeded: The request could not be completed due to the client
      exceeding the request limit.'
  source: openapi/relex-data-api-openapi.json
- status: 500
  title: Internal server error
  meaning: Generic server error indicating an unexpected problem inside RELEX services.
  remediation: Retryable.
  source: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
- status: 503
  title: Service unavailable
  meaning: The service is temporarily unavailable, for example during a system upgrade.
  remediation: Retry later.
  source: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
asynchronous_errors:
  operation_id: GetErrors
  path: /meta/errors
  why: >-
    Because ingestion is asynchronous, a 200 on a write does not mean the records were accepted by
    the planning platform. Validation and processing failures surface only here, minutes or longer
    after the write, and the same query can return more errors on a later poll.
  query_modes:
  - mode: by request
    params:
    - request_id
  - mode: by time
    params:
    - start_timestamp
    - end_timestamp
  mutually_exclusive: true
  paged: true
  page_params:
  - page
  - per_page
  per_page_max: 10000
  empty_result: 200 OK with an empty data array
  source: https://www.relexsolutions.com/api/retail-restapi-example-customer.html
monitoring_api:
  note: The RELEX Monitoring API declares its own problem responses; see
    openapi/relex-monitoring-api-openapi.json.
error_code_registry:
  published: false
  note: RELEX publishes no numeric or symbolic error-code catalogue. Problems are identified by
    HTTP status and type URI only.
